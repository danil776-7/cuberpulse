<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Оформление заказа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0F;
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo h1 { font-size: 26px; background: linear-gradient(135deg, #FFFFFF, #6C63FF); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
        .back-link { color: #6C63FF; text-decoration: none; display: inline-block; margin: 20px 0; }
        .checkout-container { display: grid; grid-template-columns: 1fr 400px; gap: 40px; margin: 40px 0 60px; }
        @media (max-width: 900px) { .checkout-container { grid-template-columns: 1fr; } }
        .form-section { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 32px; }
        .form-section h2 { margin-bottom: 24px; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.7); font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #6C63FF; }
        .order-summary { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 32px; position: sticky; top: 20px; }
        .order-items { max-height: 350px; overflow-y: auto; margin-bottom: 20px; }
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .order-item-info { display: flex; align-items: center; gap: 12px; }
        .order-item-img { font-size: 32px; }
        .total-row { display: flex; justify-content: space-between; padding: 16px 0; font-size: 20px; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 16px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #6C63FF, #4A42D0); border: none; padding: 16px; border-radius: 40px; color: white; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .payment-options { background: rgba(108, 99, 255, 0.1); border-radius: 16px; padding: 16px; margin: 16px 0; }
        .payment-options label { display: flex; align-items: center; gap: 12px; cursor: pointer; margin: 8px 0; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #111118; border-left: 4px solid #6C63FF; padding: 12px 20px; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .contact-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 380px; background: #111118; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 32px; z-index: 2000; text-align: center; }
        .contact-modal.show { display: block; animation: fadeIn 0.2s ease; }
        .contact-link { display: inline-block; background: linear-gradient(135deg, #6C63FF, #4A42D0); padding: 12px 28px; border-radius: 40px; color: white; text-decoration: none; margin: 8px 0; }
        .close-contact { background: rgba(255,255,255,0.1); border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; margin-top: 16px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1999; }
        .overlay.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="contact-modal" id="contactModal">
    <div style="font-size: 50px; margin-bottom: 16px;">✅</div>
    <h3>Заказ оформлен!</h3>
    <p>Для подтверждения и оплаты свяжитесь с менеджером:</p>
    <a href="https://t.me/cuberpulse" target="_blank" class="contact-link">📱 Написать менеджеру</a>
    <p style="font-size: 12px;">@cuberpulse</p>
    <button class="close-contact" onclick="closeContactModal()">Закрыть</button>
</div>

<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'"><h1>CuberPulse</h1></div>
    </div>
    <a href="index.html" class="back-link">← Вернуться в каталог</a>

    <div class="checkout-container">
        <div class="form-section">
            <h2>📋 Данные для доставки</h2>
            <form id="checkoutForm">
                <div class="form-group"><label>ФИО *</label><input type="text" id="fullName" required></div>
                <div class="form-group"><label>Телефон *</label><input type="tel" id="phone" required placeholder="+7 999 123-45-67"></div>
                <div class="form-group"><label>Email *</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Способ доставки *</label>
                    <select id="delivery" required>
                        <option value="">Выберите способ</option>
                        <option value="cdek">📦 CDEK (500 ₽)</option>
                        <option value="dhl">✈️ DHL Express (1500 ₽)</option>
                    </select>
                </div>
                <div class="form-group"><label>Город *</label><input type="text" id="city" required></div>
                <div class="form-group"><label>Адрес *</label><textarea id="address" rows="2" required></textarea></div>
                <div class="form-group"><label>Индекс *</label><input type="text" id="zip" required maxlength="6"></div>
                <div class="form-group"><label>Комментарий</label><textarea id="comment" rows="2"></textarea></div>
                <div class="payment-options">
                    <p>💳 Способы оплаты:</p>
                    <label><input type="radio" name="payment" value="card" checked> Оплата картой онлайн</label>
                    <label><input type="radio" name="payment" value="crypto"> Криптовалюта (USDT)</label>
                </div>
                <button type="submit" class="btn-submit">✅ Оформить заказ</button>
            </form>
        </div>

        <div class="order-summary">
            <h3>🛒 Ваш заказ</h3>
            <div id="orderItems" class="order-items"></div>
            <div class="total-row"><span>Сумма:</span><span id="subtotal">0 $</span></div>
            <div class="total-row" style="border-top:none;"><span>Доставка:</span><span id="deliveryCost">0 $</span></div>
            <div class="total-row"><span>Итого:</span><span id="orderTotal" style="color:#6C63FF; font-size:24px;">0 $</span></div>
        </div>
    </div>
</div>

<script>
    const products = [
        { id: 1, name: "Flipper Zero", price_usd: 169, img: "🐬" },
        { id: 2, name: "NRF24L01+ модуль", price_usd: 12, img: "📻" },
        { id: 3, name: "NRF24L01+ PA+LNA", price_usd: 19, img: "📡" },
        { id: 4, name: "CC1101 модуль", price_usd: 15, img: "🔘" },
        { id: 5, name: "ESP8266 NodeMCU", price_usd: 8, img: "🔵" },
        { id: 6, name: "ESP32-C3 модуль", price_usd: 12, img: "🔵" },
        { id: 7, name: "Кастомная прошивка Flipper", price_usd: 29, img: "⚙️" },
        { id: 8, name: "Marauder для Flipper", price_usd: 24, img: "⚙️" },
        { id: 9, name: "RTLSDR v3", price_usd: 35, img: "📻" },
        { id: 10, name: "Видеокурс по SDR", price_usd: 89, img: "📚" }
    ];

    let cart = JSON.parse(localStorage.getItem('checkoutCart')) || [];
    let currency = localStorage.getItem('checkoutCurrency') || 'USD';
    let totalUSD = parseFloat(localStorage.getItem('checkoutTotal')) || 0;
    let rubRate = 92;
    let deliveryCostUSD = 0;
    const deliveryPrices = { cdek: 5, dhl: 15 };
    const deliveryNames = { cdek: "📦 CDEK", dhl: "✈️ DHL Express" };

    async function fetchRubRate() {
        try { const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD'); const data = await res.json(); rubRate = data.rates.RUB; } catch(e) { rubRate = 92; }
        renderOrderSummary();
    }

    function getPrice(priceUSD) {
        if(currency === 'USD') return { val: priceUSD, sym: '$' };
        return { val: Math.round(priceUSD * rubRate), sym: '₽' };
    }

    function renderOrderSummary() {
        if(cart.length === 0) { window.location.href = 'index.html'; return; }
        const container = document.getElementById('orderItems');
        container.innerHTML = cart.map(item => {
            const p = products.find(p => p.id === item.id);
            const price = getPrice(p.price_usd);
            const total = getPrice(p.price_usd * item.quantity);
            return `<div class="order-item"><div class="order-item-info"><span class="order-item-img">${p.img}</span><div><strong>${p.name}</strong><div>${price.val} ${price.sym} × ${item.quantity}</div></div></div><div>${total.val} ${total.sym}</div></div>`;
        }).join('');
        const subtotal = getPrice(totalUSD);
        const delivery = getPrice(deliveryCostUSD);
        const total = getPrice(totalUSD + deliveryCostUSD);
        document.getElementById('subtotal').innerHTML = `${subtotal.val} ${subtotal.sym}`;
        document.getElementById('deliveryCost').innerHTML = deliveryCostUSD === 0 ? 'Бесплатно' : `${delivery.val} ${delivery.sym}`;
        document.getElementById('orderTotal').innerHTML = `${total.val} ${total.sym}`;
    }

    document.getElementById('delivery').onchange = (e) => { deliveryCostUSD = deliveryPrices[e.target.value] || 0; renderOrderSummary(); };

    // ========== TELEGRAM ОТПРАВКА С ПОДДЕРЖКОЙ ТОПИКОВ ==========
    const BOT_TOKEN = "8958424168:AAHZ2f5oGU81VuTXwJCuEdta7ntFvAOuAfc";
    const CHAT_ID = "-1003951304278";
    
    // ID топиков в вашей группе (нужно настроить в Telegram)
    // Как получить ID топика: добавить бота @ShowTopicBot в группу
    const TOPIC_IDS = {
        devices: 1,      // Топик для устройств
        modules: 2,      // Топик для модулей
        firmware: 3,     // Топик для прошивок
        other: 4         // Топик для остального
    };

    // Функция определения топика по товарам в заказе
    function getTopicByProducts(cartItems) {
        // Проверяем категории товаров
        const hasDevices = cartItems.some(item => {
            const p = products.find(p => p.id === item.id);
            return p && (p.name.includes("Flipper") || p.name.includes("HackRF") || p.name.includes("RTLSDR"));
        });
        const hasModules = cartItems.some(item => {
            const p = products.find(p => p.id === item.id);
            return p && (p.name.includes("NRF") || p.name.includes("CC1101") || p.name.includes("ESP"));
        });
        const hasFirmware = cartItems.some(item => {
            const p = products.find(p => p.id === item.id);
            return p && (p.name.includes("прошивка") || p.name.includes("Marauder"));
        });
        
        if(hasDevices) return TOPIC_IDS.devices;
        if(hasModules) return TOPIC_IDS.modules;
        if(hasFirmware) return TOPIC_IDS.firmware;
        return TOPIC_IDS.other;
    }

    // Форматирование сообщения с эмодзи для разных топиков
    function getTopicEmoji(topicId) {
        const emojis = {
            [TOPIC_IDS.devices]: "📟",
            [TOPIC_IDS.modules]: "🔌", 
            [TOPIC_IDS.firmware]: "⚙️",
            [TOPIC_IDS.other]: "📦"
        };
        return emojis[topicId] || "📦";
    }

    async function sendOrderToTelegram(orderData) {
        const topicId = getTopicByProducts(cart);
        const topicEmoji = getTopicEmoji(topicId);
        
        const message = `${topicEmoji} **НОВЫЙ ЗАКАЗ** ${topicEmoji}\n━━━━━━━━━━━━━━━━━━━\n\n👤 **КЛИЕНТ:**\n• ФИО: ${orderData.fullName}\n• Телефон: ${orderData.phone}\n• Email: ${orderData.email}\n\n📍 **ДОСТАВКА:**\n• Способ: ${orderData.delivery}\n• Город: ${orderData.city}\n• Адрес: ${orderData.address}\n• Индекс: ${orderData.zip}\n\n📦 **ТОВАРЫ:**\n${orderData.items}\n\n💰 **ОПЛАТА:**\n• Способ: ${orderData.payment}\n• Сумма: ${orderData.total}\n\n💬 **КОММЕНТАРИЙ:**\n${orderData.comment || "Нет"}\n\n⏰ **Время:** ${new Date().toLocaleString()}\n━━━━━━━━━━━━━━━━━━━\n#новый_заказ`;
        
        // Отправляем в конкретный топик
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&message_thread_id=${topicId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;
        
        // Также отправляем копию в общий чат (опционально)
        const generalUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(`📢 Новый заказ в топик ${topicEmoji}`)}`;
        
        try { 
            const res = await fetch(url); 
            const data = await res.json();
            // Отправляем уведомление в общий чат (необязательно)
            await fetch(generalUrl);
            return data.ok; 
        } catch(e) { 
            console.error('Ошибка:', e);
            return false; 
        }
    }

    function saveOrderLocally(orderData) {
        const orders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        orders.push({ ...orderData, savedAt: new Date().toISOString() });
        localStorage.setItem('saved_orders', JSON.stringify(orders));
    }

    function showToast(msg, color) {
        const toast = document.createElement('div'); toast.className = 'toast'; toast.style.borderLeftColor = color; toast.innerHTML = msg;
        document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
    }

    function openContactModal() { document.getElementById('contactModal').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
    function closeContactModal() { document.getElementById('contactModal').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); window.location.href = 'index.html'; }
    window.closeContactModal = closeContactModal;

    document.getElementById('checkoutForm').onsubmit = async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const delivery = document.getElementById('delivery').value;
        const city = document.getElementById('city').value.trim();
        const address = document.getElementById('address').value.trim();
        const zip = document.getElementById('zip').value.trim();
        const comment = document.getElementById('comment').value.trim();
        const payment = document.querySelector('input[name="payment"]:checked').value;
        
        if(!fullName || !phone || !email || !delivery || !city || !address || !zip) { showToast("Заполните все поля", "#F87171"); return; }
        const phoneDigits = phone.replace(/\D/g, '');
        if(phoneDigits.length !== 11) { showToast("Неверный номер телефона", "#F87171"); return; }
        
        const itemsList = cart.map(item => { 
            const p = products.find(pp => pp.id === item.id); 
            const price = getPrice(p.price_usd); 
            return `• ${p.name} × ${item.quantity} = ${price.val * item.quantity} ${price.sym}`; 
        }).join('\n');
        
        const total = getPrice(totalUSD + deliveryCostUSD);
        const orderData = { 
            fullName, phone, email, 
            delivery: deliveryNames[delivery], 
            city, address, zip, 
            items: itemsList, 
            payment: payment === 'card' ? '💳 Карта' : '🪙 Криптовалюта', 
            total: `${total.val} ${total.sym}`, 
            comment 
        };
        
        const btn = document.querySelector('.btn-submit');
        btn.disabled = true; 
        btn.innerText = "⏳ Отправка...";
        
        const sent = await sendOrderToTelegram(orderData);
        if(!sent) saveOrderLocally(orderData);
        
        localStorage.removeItem('cart'); 
        localStorage.removeItem('checkoutCart');
        showToast("✅ Заказ оформлен!", "#4ADE80");
        
        setTimeout(() => { 
            openContactModal(); 
            btn.disabled = false; 
        }, 1000);
    };
    
    fetchRubRate(); 
    if(cart.length === 0) window.location.href = 'index.html';
</script>
</body>
</html>
