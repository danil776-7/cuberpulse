<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Админ-панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 16px; }
        .logo h1 { font-size: 24px; background: linear-gradient(135deg, #FFFFFF, #6C63FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn { background: linear-gradient(135deg, #6C63FF, #4A42D0); border: none; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: scale(1.02); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 40px; color: rgba(255,255,255,0.8); cursor: pointer; transition: all 0.2s; }
        .btn-outline:hover { border-color: #6C63FF; color: #6C63FF; }
        .btn-small { padding: 6px 12px; font-size: 12px; }
        .btn-danger { border-color: #F87171; color: #F87171; }
        .btn-danger:hover { background: #F87171; color: white; }
        .admin-panel { display: grid; grid-template-columns: 280px 1fr; gap: 32px; margin: 32px 0 60px; }
        @media (max-width: 800px) { .admin-panel { grid-template-columns: 1fr; } }
        .sidebar { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; }
        .sidebar h3 { margin-bottom: 20px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { padding: 12px 0; cursor: pointer; color: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; }
        .sidebar-menu li:hover, .sidebar-menu li.active { color: #6C63FF; }
        .content { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; }
        .content h2 { margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: rgba(255,255,255,0.7); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #6C63FF; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card-admin { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; transition: all 0.2s; }
        .product-card-admin:hover { background: rgba(255,255,255,0.08); }
        .product-header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        .product-img-admin { width: 70px; height: 70px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 40px; }
        .product-img-admin img { width: 100%; height: 100%; object-fit: cover; }
        .product-info-admin { flex: 1; }
        .product-name-admin { font-size: 18px; font-weight: 600; }
        .product-price-admin { color: #6C63FF; margin-top: 4px; }
        .product-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .login-form { max-width: 420px; margin: 100px auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 40px; }
        .login-form h2 { margin-bottom: 24px; text-align: center; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #111118; border-left: 4px solid #6C63FF; padding: 12px 20px; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .category-badge { display: inline-block; background: rgba(108, 99, 255, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 11px; margin-top: 6px; }
        .spec-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .spec-item input { flex: 1; }
        .add-spec-btn { background: rgba(108, 99, 255, 0.2); border: 1px dashed #6C63FF; padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; }
        .order-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .order-card .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .order-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .order-status.new { background: #3B82F6; }
        .order-status.processing { background: #FBBF24; color: #000; }
        .order-status.delivered { background: #4ADE80; color: #000; }
        .order-status.cancelled { background: #F87171; }
        .empty-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.5); }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
        .image-preview { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
        .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .image-preview .preview-item { position: relative; }
        .image-preview .remove-preview { position: absolute; top: -6px; right: -6px; background: #F87171; border: none; border-radius: 50%; width: 20px; height: 20px; color: white; cursor: pointer; font-size: 12px; }
        .photo-guide { background: rgba(108,99,255,0.1); border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 13px; border-left: 3px solid #6C63FF; }
        .photo-guide .step { margin: 4px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚙️ CuberPulse | Админ-панель</h1></div>
        <div><button class="btn-outline" id="logoutBtn" style="display:none;">🚪 Выйти</button></div>
    </div>

    <div id="loginSection" class="login-form">
        <h2>🔐 Вход в админ-панель</h2>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="adminLogin" placeholder="Введите логин">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="adminPassword" placeholder="Введите пароль">
        </div>
        <button class="btn" id="loginBtn" style="width:100%;">Войти</button>
    </div>

    <div id="adminSection" class="admin-panel" style="display:none;">
        <div class="sidebar">
            <h3>📋 Меню</h3>
            <ul class="sidebar-menu">
                <li data-tab="products" class="active">📦 Товары</li>
                <li data-tab="add">➕ Добавить товар</li>
                <li data-tab="orders">📋 Заказы</li>
            </ul>
        </div>

        <div class="content">
            <div id="tab-products" class="tab-content">
                <h2>📦 Управление товарами</h2>
                <div id="productsList" class="products-grid"></div>
            </div>

            <div id="tab-add" class="tab-content" style="display:none;">
                <h2 id="formTitle">➕ Добавить товар</h2>
                <div class="photo-guide">
                    <strong>📸 Как добавить фото:</strong>
                    <div class="step">1. Загрузите фото в папку <strong>images</strong> на GitHub</div>
                    <div class="step">2. В поле "Главное фото" укажите путь: <strong>images/название-файла.jpg</strong></div>
                </div>
                <form id="productForm">
                    <input type="hidden" id="editId" value="">
                    <div class="form-row">
                        <div class="form-group"><label>Название товара *</label><input type="text" id="prodName" required></div>
                        <div class="form-group"><label>Категория *</label>
                            <select id="prodCategory">
                                <option value="devices">📟 Устройства</option>
                                <option value="modules">🔌 Модули</option>
                                <option value="firmware">⚙️ Прошивки</option>
                                <option value="antennas">📡 Антенны</option>
                                <option value="accessories">🔧 Аксессуары</option>
                                <option value="sdr">📻 SDR</option>
                                <option value="guides">📚 Обучение</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Цена (USD) *</label><input type="number" id="prodPrice" step="1" required></div>
                        <div class="form-group"><label>Цена со скидкой (USD)</label><input type="number" id="prodSalePrice" step="1" placeholder="Оставьте пустым"></div>
                    </div>
                    <div class="form-group"><label>Главное фото (путь в папке images)</label><input type="text" id="prodImg" placeholder="images/flipper-zero.jpg"><div id="mainPhotoPreview" class="image-preview"></div></div>
                    <div class="form-group"><label>Дополнительные фото (через запятую)</label><input type="text" id="prodImages" placeholder="images/flipper-zero-1.jpg, images/flipper-zero-2.jpg"><div id="galleryPhotoPreview" class="image-preview"></div></div>
                    <div class="form-group"><label>Краткое описание *</label><textarea id="prodDesc" rows="2" required></textarea></div>
                    <div class="form-group"><label>Полное описание</label><textarea id="prodFullDesc" rows="3"></textarea></div>
                    <div class="form-group"><label>Характеристики</label><div id="specsContainer"></div><button type="button" class="add-spec-btn" onclick="addSpecField()">+ Добавить характеристику</button></div>
                    <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
                        <button type="submit" class="btn">💾 Сохранить товар</button>
                        <button type="button" class="btn-outline" onclick="cancelEdit()">Отмена</button>
                    </div>
                </form>
            </div>

            <div id="tab-orders" class="tab-content" style="display:none;">
                <h2>📋 История заказов</h2>
                <div id="ordersList"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let products = [];
    const ADMIN_LOGIN = "admin";
    const ADMIN_PASSWORD = "admin123";

    function checkAuth() {
        const isAuth = localStorage.getItem('admin_auth') === 'true';
        if (isAuth) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'grid';
            document.getElementById('logoutBtn').style.display = 'block';
            loadProducts();
            loadOrders();
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }
    }

    document.getElementById('loginBtn').onclick = () => {
        const login = document.getElementById('adminLogin').value;
        const password = document.getElementById('adminPassword').value;
        if (login === ADMIN_LOGIN && password === ADMIN_PASSWORD) {
            localStorage.setItem('admin_auth', 'true');
            checkAuth();
            showToast("✅ Вход выполнен", "#4ADE80");
        } else {
            showToast("❌ Неверный логин или пароль", "#F87171");
        }
    };

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('admin_auth');
        checkAuth();
        showToast("🔓 Выход выполнен", "#9AA4BF");
    };

    // ========== ПОЛНЫЙ КАТАЛОГ ТОВАРОВ ==========
    function loadProducts() {
        const saved = localStorage.getItem('admin_products');
        if (saved && saved !== 'undefined' && saved !== 'null') {
            try {
                products = JSON.parse(saved);
                if (products && products.length > 0) {
                    renderProductsList();
                    return;
                }
            } catch (e) { }
        }

        // Полный список товаров с описаниями с фотографий
        products = [
            // 📟 Устройства
            { id: 1, name: "Flipper Zero", price_usd: 169, salePrice: null, category: "devices", img: "🐬", desc: "Многофункциональный инструмент для гиков: RFID/NFC, Sub-GHz, инфракрасный, Bluetooth, GPIO, UART.", fullDesc: "Flipper Zero — это портативный многофункциональный инструмент для пентестеров и энтузиастов безопасности. Поддерживает RFID/NFC, Sub-GHz, инфракрасный порт, Bluetooth, GPIO, UART. Имеет встроенный аккумулятор, OLED дисплей и MicroSD слот. В неправильных руках может быть опасен!", specs: ["RFID / NFC", "Sub-GHz", "Инфракрасный порт", "Bluetooth", "GPIO / UART", "OLED дисплей", "Аккумулятор"], images: [] },
            
            { id: 2, name: "HackRF One", price_usd: 299, salePrice: null, category: "devices", img: "📡", desc: "Software Defined Radio (SDR) платформа 1 МГц – 6 ГГц. Полный дуплекс TX & RX.", fullDesc: "HackRF One — это программно-определяемая радиоплатформа (SDR), которая может передавать или принимать радиосигналы в диапазоне от 1 МГц до 6 ГГц. Это важный инструмент для пентестеров, исследователей и специалистов по RF-безопасности.", specs: ["1 MHz to 6 GHz frequency range", "Full duplex (TX & RX)", "8-bit quadrature samples up to 20 Msps", "USB 2.0 powered", "Open source hardware & software", "Compatible with Linux, Windows & macOS", "SMA Female antenna port (50Ω)"], images: [] },
            
            { id: 3, name: "HackRF One Portapack H2", price_usd: 429, salePrice: 399, category: "devices", img: "📱", desc: "HackRF One с портативным экраном для автономной работы.", fullDesc: "Портативная версия HackRF One с сенсорным экраном, аккумулятором и MicroSD слотом. Позволяет работать автономно без подключения к компьютеру.", specs: ["Сенсорный дисплей", "Аккумулятор", "MicroSD слот", "Автономная работа"], images: [] },
            
            // 🔌 Модули для Flipper Zero
            { id: 4, name: "NRF24 для Flipper Zero", price_usd: 15, salePrice: null, category: "modules", img: "📻", desc: "Модуль nRF24L01+ для Flipper Zero. Больше возможностей в твоих руках!", fullDesc: "Модуль nRF24L01+ для Flipper Zero. Работает в диапазоне 2.4 ГГц (2400-2525 ГГц). Дальность до 100 м. Низкое энергопотребление. Полная поддержка с Flipper Zero. Открытые возможности: работа со скриптами и плагинами. Применение: анализ устройств, тестирование, исследование, образовательные цели. Работает с игрушками, клавиатурами, датчиками, дронами и другими устройствами.", specs: ["Чип: nRF24L01+", "Диапазон: 2.4 GHz (2400-2525 GHz)", "Дальность: до 100 м", "Скорость: до 2 Мбит/с", "Низкое энергопотребление", "Полная поддержка с Flipper Zero", "Открытые возможности"], images: [] },
            
            { id: 5, name: "Wi-Fi Devboard для Flipper Zero", price_usd: 25, salePrice: null, category: "modules", img: "📶", desc: "ESP32-S2 Wi-Fi модуль для Flipper Zero. Больше возможностей для твоего Flipper Zero!", fullDesc: "Wi-Fi Devboard для Flipper Zero на базе ESP32-S2. Мощный микроконтроллер с Wi-Fi 802.11 b/g/n. Open Source. GPIO доступ к пинам для собственных проектов. USB-C для подключения и прошивки. Идеально работает с Flipper Zero. Возможности: сканирование Wi-Fi сетей, анализ точек доступа, тестирование безопасности, разработка собственных скриптов, расширение функционала Flipper Zero.", specs: ["Микроконтроллер: ESP32-S2", "Wi-Fi 2.4 GHz 802.11 b/g/n", "Open Source", "GPIO доступ к пинам", "USB-C", "Совместимость с Flipper Zero"], images: [] },
            
            { id: 6, name: "ESP32 Marauder для Flipper Zero", price_usd: 35, salePrice: null, category: "modules", img: "📡", desc: "Мощный доп. модуль для Flipper Zero. Беспроводные исследования нового уровня.", fullDesc: "ESP32 Marauder — мощный дополнительный модуль для Flipper Zero. Wi-Fi сканирование: поиск сетей, анализ, деаутентификация. Bluetooth анализ: сканирование и перехват устройств. Мультифункциональность: Wi-Fi, BLE, Deauth, Evil Twin, Beacon Spam, Packet Monitor. Открытый исходный код. Легкая установка: готов к работе с Flipper Zero. Автономная работа: питание от Flipper Zero. Больше возможностей, больше контроля.", specs: ["2.4 GHz Wi-Fi", "Bluetooth BLE", "Deauth / Evil Twin", "Beacon Spam / Packet Monitor", "Open Source", "USB / UART интерфейс", "Автономная работа"], images: [] },
            
            { id: 7, name: "CC1101 HP Sub-GHz модуль для Flipper Zero", price_usd: 22, salePrice: null, category: "modules", img: "📻", desc: "Больше частот — больше возможностей. Расширяет возможности твоего Flipper Zero!", fullDesc: "CC1101-HP Sub-GHz модуль для Flipper Zero. Расширение Sub-GHz диапазона. Высокая чувствительность (High Power). Поддержка множества протоколов. Простая установка. Совместим с Flipper Zero. Идеален для исследований. Частотный диапазон 300-928 МГц. Больше функций — больше свободы. Исследуй, тестируй, создавай, развивайся.", specs: ["Частотный диапазон: 300 - 928 MHz", "Высокая чувствительность (High Power)", "Поддержка множества протоколов", "Простая установка", "Совместим с Flipper Zero"], images: [] },
            
            { id: 8, name: "Chameleon Ultra", price_usd: 45, salePrice: null, category: "devices", img: "🦎", desc: "Универсальный инструмент для работы с RFID и NFC.", fullDesc: "Chameleon Ultra — универсальный инструмент для работы с RFID и NFC. Поддержка RFID / NFC: 125 кГц, 13,56 МГц. Широкий диапазон частот для работы с большинством стандартов. Чтение и запись: считывание, запись, копирование и редактирование данных RFID/NFC. Открытая платформа: поддержка плагинов, скриптов и кастомных прошивок (ChameleonMini/Ultra FW). Гибкие возможности: поддержка обычных, защищённых и кастомных форматов. Большая память: до 8 МБ для хранения ключей, дампов и эмуляций. Эмуляция: работа в режиме эмуляции карт и меток (включая UID, MIFARE, NTAG и др.). Автономная работа: встроенный аккумулятор до нескольких недель. Компактный и прочный: удобный размер, надёжный корпус.", specs: ["RFID / NFC: 125 кГц, 13,56 МГц", "Память: до 8 МБ", "Эмуляция карт (UID, MIFARE, NTAG)", "Открытая платформа", "Автономная работа", "Встроенный аккумулятор"], images: [] },
            
            // 🔧 Аксессуары
            { id: 9, name: "USB Rubber Ducky", price_usd: 55, salePrice: null, category: "accessories", img: "🦆", desc: "Выглядит как флешка, работает как клавиатура. Маленькое устройство — большие идеи.", fullDesc: "USB Rubber Ducky — это устройство, которое эмулирует клавиатуру и автоматически выполняет заранее заданные команды при подключении к компьютеру. «Простое решение для сложных задач». Основные характеристики: Микроконтроллер ATmega32U4 (полностью совместимый), Интерфейс USB HID (Keyboard), Программирование Ducky Script, Хранилище microSD (FAT32, до 32 ГБ), Питание 5V (от USB), Размеры 55×15×8 мм, Совместимость Windows / macOS / Linux / Android, Доп. функции: LED индикатор, кнопка, перепрошивка, Масса ~8 г.", specs: ["Микроконтроллер ATmega32U4", "USB HID (Keyboard)", "Ducky Script", "microSD до 32 ГБ", "Совместимость: Windows, macOS, Linux, Android", "Автоматизация, пентест, социальная инженерия"], images: [] },
            
            { id: 10, name: "Plunder Bug LAN Tap", price_usd: 65, salePrice: null, category: "accessories", img: "🔌", desc: "Карманный Smart LAN Tap для мониторинга проводных сетей.", fullDesc: "Plunder Bug — компактный инструмент для глубокого анализа сетевого трафика. 2× RJ45 порта: пассивное подключение без перерыва сети. USB-C питание: удобно и современно. Пассивный режим: не влияет на работу сети. Высокая пропускная способность: поддержка Gigabit Ethernet (10/100/1000 Мбит/с). Компактный размер: легко носить и использовать. Широкая совместимость: работает с основными снифферами и анализаторами (tcpdump, Wireshark и др.). Больше данных — больше контроля — больше безопасности.", specs: ["2× RJ45 порта", "USB-C питание", "Пассивный режим", "Gigabit Ethernet (10/100/1000 Мбит/с)", "Совместимость: tcpdump, Wireshark"], images: [] },

            { id: 14, name: "Clockwork", price_usd: 249, salePrice: null, category: "devices", img: "⌚", desc: "Портативная хакерская платформа. Исследуй. Анализируй. Взламывай.", fullDesc: "Clockwork — это портативное устройство с открытым исходным кодом, созданное для пентестеров, энтузиастов и исследователей безопасности. Основные функции: Тестирование беспроводных сетей (мониторинг, перехват и анализ Wi-Fi сетей, поддержка режимов мониторинга и атаки). Работа с радиомодулями (поддержка частот 433 МГц, 868 МГц, 915 МГц и других; перехват, анализ и эмуляция радиосигналов). Встроенный терминал Linux (полноценный Linux на борту для запуска инструментов и скриптов прямо на устройстве). Расширяемость (подключение дополнительных модулей через GPIO, поддержка USB-устройств и кастомных плат). Автоматизация и скрипты (поддержка Python, Bash и других языков для автоматизации задач и пентестинговых сценариев). Портативность (компактный размер, аккумулятор и автономность — работай где угодно и когда угодно). Твой инструмент в мире кибербезопасности.", specs: ["Тестирование беспроводных сетей", "Работа с радиомодулями (433, 868, 915 МГц)", "Встроенный терминал Linux", "Расширяемость через GPIO", "Поддержка Python, Bash", "Портативность и автономность"], images: [] }
        ];
        
        localStorage.setItem('admin_products', JSON.stringify(products));
        renderProductsList();
    }

    function renderProductsList() {
        const container = document.getElementById('productsList');
        if (!products || products.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>Нет товаров</p></div>`;
            return;
        }

        container.innerHTML = '';
        products.forEach(p => {
            const displayPrice = p.salePrice ? `${p.salePrice}$ (было ${p.price_usd}$)` : `${p.price_usd}$`;
            const categoryName = getCategoryName(p.category);
            const isImagePath = p.img && (p.img.startsWith('images/') || p.img.startsWith('http'));
            const imgHtml = isImagePath ? `<img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>📦</span>';">` : `<span>${p.img || '📦'}</span>`;

            const card = document.createElement('div');
            card.className = 'product-card-admin';
            card.innerHTML = `
                <div class="product-header">
                    <div class="product-img-admin">${imgHtml}</div>
                    <div class="product-info-admin">
                        <div class="product-name-admin">${escapeHtml(p.name)}</div>
                        <div class="product-price-admin">💰 ${displayPrice}</div>
                        <div class="category-badge">${categoryName}</div>
                    </div>
                </div>
                <div class="product-actions">
                    <button class="btn-outline btn-small" onclick="editProduct(${p.id})">✏️ Редактировать</button>
                    <button class="btn-outline btn-small btn-danger" onclick="deleteProduct(${p.id})">🗑️ Удалить</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function getCategoryName(catId) {
        const categories = {
            devices: "📟 Устройства",
            modules: "🔌 Модули",
            firmware: "⚙️ Прошивки",
            antennas: "📡 Антенны",
            accessories: "🔧 Аксессуары",
            sdr: "📻 SDR",
            guides: "📚 Обучение"
        };
        return categories[catId] || catId;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    window.editProduct = function (id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        document.getElementById('formTitle').innerHTML = '✏️ Редактировать товар';
        document.getElementById('editId').value = id;
        document.getElementById('prodName').value = product.name;
        document.getElementById('prodPrice').value = product.price_usd;
        document.getElementById('prodSalePrice').value = product.salePrice || '';
        document.getElementById('prodCategory').value = product.category;
        document.getElementById('prodDesc').value = product.desc;
        document.getElementById('prodFullDesc').value = product.fullDesc || '';
        document.getElementById('prodImg').value = product.img || '';
        document.getElementById('prodImages').value = (product.images || []).join(', ');

        const specsContainer = document.getElementById('specsContainer');
        specsContainer.innerHTML = '';
        if (product.specs && product.specs.length) {
            product.specs.forEach(spec => addSpecField(spec));
        } else {
            addSpecField('');
        }

        document.querySelector('[data-tab="add"]').click();
    };

    window.cancelEdit = function () {
        document.getElementById('formTitle').innerHTML = '➕ Добавить товар';
        document.getElementById('productForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('specsContainer').innerHTML = '';
        document.getElementById('mainPhotoPreview').innerHTML = '';
        document.getElementById('galleryPhotoPreview').innerHTML = '';
        addSpecField('');
    };

    window.addSpecField = function (value = '') {
        const container = document.getElementById('specsContainer');
        const div = document.createElement('div');
        div.className = 'spec-item';
        div.innerHTML = `
            <input type="text" class="spec-input" value="${escapeHtml(value)}" placeholder="Например: OLED экран">
            <button type="button" class="btn-outline btn-small btn-danger" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(div);
    };

    document.getElementById('productForm').onsubmit = (e) => {
        e.preventDefault();
        const specs = [];
        document.querySelectorAll('.spec-input').forEach(input => {
            if (input.value.trim()) specs.push(input.value.trim());
        });
        const images = document.getElementById('prodImages').value.split(',').map(s => s.trim()).filter(s => s);

        const productData = {
            name: document.getElementById('prodName').value.trim(),
            price_usd: parseInt(document.getElementById('prodPrice').value),
            salePrice: document.getElementById('prodSalePrice').value ? parseInt(document.getElementById('prodSalePrice').value) : null,
            category: document.getElementById('prodCategory').value,
            img: document.getElementById('prodImg').value.trim() || '📦',
            desc: document.getElementById('prodDesc').value.trim(),
            fullDesc: document.getElementById('prodFullDesc').value.trim(),
            specs: specs,
            images: images
        };

        const editId = document.getElementById('editId').value;
        if (editId) {
            const index = products.findIndex(p => p.id == editId);
            if (index !== -1) {
                productData.id = parseInt(editId);
                products[index] = productData;
            }
        } else {
            productData.id = Date.now();
            products.push(productData);
        }

        localStorage.setItem('admin_products', JSON.stringify(products));
        renderProductsList();
        cancelEdit();
        showToast("✅ Товар сохранён", "#4ADE80");
        document.querySelector('[data-tab="products"]').click();
    };

    window.deleteProduct = function (id) {
        const product = products.find(p => p.id === id);
        if (confirm(`Удалить товар "${product.name}"?`)) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('admin_products', JSON.stringify(products));
            renderProductsList();
            showToast("🗑️ Товар удалён", "#F87171");
        }
    };

    function loadOrders() {
        const container = document.getElementById('ordersList');
        const savedOrders = JSON.parse(localStorage.getItem('saved_orders') || '[]');

        if (savedOrders.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>Нет заказов</p></div>`;
            return;
        }

        container.innerHTML = '';
        savedOrders.reverse().forEach((order, index) => {
            const statusClass = order.status || 'new';
            const statusText = { new: '🆕 Новый', processing: '🔄 В обработке', delivered: '✅ Доставлен', cancelled: '❌ Отменён' }[statusClass] || '🆕 Новый';

            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div class="order-header">
                    <div>
                        <strong>👤 ${escapeHtml(order.fullName)}</strong>
                        <div style="font-size:13px;">📞 ${escapeHtml(order.phone)}</div>
                        <div style="font-size:13px;">📧 ${escapeHtml(order.email)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="order-status ${statusClass}">${statusText}</div>
                        <div style="font-size:13px; margin-top:4px;">💰 ${escapeHtml(order.total)}</div>
                    </div>
                </div>
                <div style="font-size:13px; margin-top:8px; color:rgba(255,255,255,0.5);">
                    📍 ${escapeHtml(order.city)}, ${escapeHtml(order.address)}<br>
                    📦 ${escapeHtml(order.delivery)}<br>
                    ⏰ ${new Date(order.savedAt).toLocaleString()}
                </div>
                <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn-outline btn-small" onclick="updateOrderStatus(${index}, 'processing')">🔄 В обработку</button>
                    <button class="btn-outline btn-small" onclick="updateOrderStatus(${index}, 'delivered')">✅ Доставлен</button>
                    <button class="btn-outline btn-small btn-danger" onclick="updateOrderStatus(${index}, 'cancelled')">❌ Отменить</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.updateOrderStatus = function (index, status) {
        const orders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        const reversed = orders.reverse();
        reversed[index].status = status;
        localStorage.setItem('saved_orders', JSON.stringify(reversed.reverse()));
        loadOrders();
        showToast("✅ Статус обновлён", "#4ADE80");
    };

    document.querySelectorAll('.sidebar-menu li').forEach(item => {
        item.onclick = () => {
            document.querySelectorAll('.sidebar-menu li').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            const tab = item.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(`tab-${tab}`).style.display = 'block';
            if (tab === 'orders') loadOrders();
            if (tab === 'products') renderProductsList();
        };
    });

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // Реагируем на изменение полей фото для предпросмотра
    document.getElementById('prodImg').addEventListener('input', function() {
        const preview = document.getElementById('mainPhotoPreview');
        const url = this.value.trim();
        if (url && (url.startsWith('images/') || url.startsWith('http'))) {
            preview.innerHTML = `<div class="preview-item"><img src="${url}" onerror="this.style.display='none';"><button class="remove-preview" onclick="this.parentElement.remove()">✕</button></div>`;
        } else {
            preview.innerHTML = '';
        }
    });

    document.getElementById('prodImages').addEventListener('input', function() {
        const preview = document.getElementById('galleryPhotoPreview');
        const urls = this.value.split(',').map(s => s.trim()).filter(s => s && (s.startsWith('images/') || s.startsWith('http')));
        preview.innerHTML = urls.map(url => `<div class="preview-item"><img src="${url}" onerror="this.style.display='none';"><button class="remove-preview" onclick="this.parentElement.remove()">✕</button></div>`).join('');
    });

    checkAuth();
</script>
</body>
