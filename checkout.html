<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Оформление заказа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #FFFFFF, #6C63FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .back-link {
            color: #6C63FF;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            margin: 40px 0 60px;
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
        }

        .form-section h2 {
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6C63FF;
        }

        .order-summary {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .order-summary h3 {
            margin-bottom: 20px;
        }

        .order-items {
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .order-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-item-img {
            font-size: 32px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            font-size: 20px;
            font-weight: 700;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 16px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .delivery-options {
            background: rgba(108, 99, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
        }

        .delivery-options label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin: 8px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'">
            <h1>CuberPulse</h1>
        </div>
    </div>

    <a href="index.html" class="back-link">← Вернуться в каталог</a>

    <div class="checkout-container">
        <div class="form-section">
            <h2>📋 Данные для доставки</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>ФИО *</label>
                    <input type="text" id="fullName" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="phone" required placeholder="+7 999 123-45-67">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Способ доставки *</label>
                    <select id="delivery" required>
                        <option value="">Выберите способ доставки</option>
                        <option value="courier">🚚 Курьерская доставка (500 ₽)</option>
                        <option value="pickup">📦 Самовывоз (бесплатно)</option>
                        <option value="post">📮 Почта России (300 ₽)</option>
                    </select>
                </div>
                <div class="form-group" id="addressGroup">
                    <label>Адрес доставки *</label>
                    <textarea id="address" rows="3" placeholder="Город, улица, дом, квартира"></textarea>
                </div>
                <div class="form-group">
                    <label>Комментарий к заказу</label>
                    <textarea id="comment" rows="2" placeholder="Дополнительная информация"></textarea>
                </div>
                
                <div class="delivery-options">
                    <p style="margin-bottom: 12px;">💳 Способы оплаты:</p>
                    <label>
                        <input type="radio" name="payment" value="card" checked> Оплата картой онлайн
                    </label>
                    <label>
                        <input type="radio" name="payment" value="crypto"> Криптовалюта (USDT)
                    </label>
                    <label>
                        <input type="radio" name="payment" value="cash"> Наличные при получении
                    </label>
                </div>

                <button type="submit" class="btn-submit">✅ Оформить заказ</button>
            </form>
        </div>

        <div class="order-summary">
            <h3>🛒 Ваш заказ</h3>
            <div id="orderItems" class="order-items"></div>
            <div class="total-row">
                <span>Сумма:</span>
                <span id="subtotal" style="color:#6C63FF;">0 $</span>
            </div>
            <div class="total-row" style="border-top:none; padding-top:0;">
                <span>Доставка:</span>
                <span id="deliveryCost">0 $</span>
            </div>
            <div class="total-row">
                <span>Итого к оплате:</span>
                <span id="orderTotal" style="color:#6C63FF; font-size:24px;">0 $</span>
            </div>
            <p style="font-size:12px; color:rgba(255,255,255,0.5); margin-top:16px; text-align:center;">
                🔒 После оформления заказа с вами свяжется менеджер<br>
                для подтверждения и уточнения деталей.
            </p>
        </div>
    </div>
</div>

<script>
    // ========== ТОВАРЫ (расширенный список) ==========
    const products = [
        { id: 1, name: "Flipper Zero", price_usd: 169, price_rub: 16900, img: "🐬", desc: "Мультитул для пентеста: RFID, IR, GPIO, iButton, Sub-GHz" },
        { id: 2, name: "HackRF One", price_usd: 299, price_rub: 29900, img: "📡", desc: "SDR-трансивер 1 МГц – 6 ГГц, 20 МГц полоса пропускания" },
        { id: 3, name: "HackRF One Portapack", price_usd: 429, price_rub: 42900, img: "📱", desc: "HackRF One с экраном для автономной работы" },
        { id: 4, name: "WiFi Deauther v3", price_usd: 49, price_rub: 4900, img: "📶", desc: "Атака деавторизации WiFi, мониторинг сетей" },
        { id: 5, name: "NRF24L01+ модуль", price_usd: 12, price_rub: 1200, img: "📻", desc: "2.4GHz беспроводной модуль для Flipper Zero" },
        { id: 6, name: "NRF24L01+ PA+LNA", price_usd: 19, price_rub: 1900, img: "📡", desc: "Усиленный модуль с антенной, дальность до 1000м" },
        { id: 7, name: "CC1101 модуль", price_usd: 15, price_rub: 1500, img: "🔘", desc: "Суб-ГГц трансивер 315/433/868/915 МГц" },
        { id: 8, name: "ESP8266 WiFi модуль", price_usd: 8, price_rub: 800, img: "📶", desc: "Дешёвый WiFi модуль для IoT проектов" },
        { id: 9, name: "ESP32-C3 модуль", price_usd: 12, price_rub: 1200, img: "🔵", desc: "Современный WiFi + Bluetooth LE модуль" },
        { id: 10, name: "GPS/GNSS модуль NEO-6M", price_usd: 35, price_rub: 3500, img: "🛰️", desc: "Спутниковая навигация для Flipper/HackRF" },
        { id: 11, name: "GPS/GNSS NEO-8M", price_usd: 45, price_rub: 4500, img: "🛰️", desc: "Высокоточный GPS модуль с поддержкой ГЛОНАСС" },
        { id: 12, name: "Широкополосная антенна", price_usd: 42, price_rub: 4200, img: "📡", desc: "300MHz – 6GHz, SMA разъём, усиление 3dBi" },
        { id: 13, name: "Направленная антенна 2.4GHz", price_usd: 38, price_rub: 3800, img: "📡", desc: "Усиление 12dBi для WiFi атак" },
        { id: 14, name: "HF/VHF антенна", price_usd: 55, price_rub: 5500, img: "📡", desc: "Для работы с HackRF в низкочастотном диапазоне" },
        { id: 15, name: "Кастомная прошивка Flipper", price_usd: 29, price_rub: 2900, img: "⚙️", desc: "Расширенный функционал: новые протоколы, бэкапы" },
        { id: 16, name: "Marauder для Flipper", price_usd: 24, price_rub: 2400, img: "⚙️", desc: "WiFi атаки, Evil Portal, Beacon Spam" },
        { id: 17, name: "Mifare Classic 1K карты", price_usd: 15, price_rub: 1500, img: "💳", desc: "10 шт. RFID карт для тестирования" },
        { id: 18, name: "Proxmark3 Easy", price_usd: 89, price_rub: 8900, img: "💳", desc: "Бюджетная версия для RFID/NFC исследований" },
        { id: 19, name: "RTLSDR v3", price_usd: 35, price_rub: 3500, img: "📻", desc: "Бюджетный SDR приёмник 100kHz – 1.7GHz" },
        { id: 20, name: "Видеокурс по SDR", price_usd: 89, price_rub: 8900, img: "📚", desc: "Полное руководство по HackRF One: от новичка до эксперта" }
    ];

    // Получаем данные корзины
    let cart = JSON.parse(localStorage.getItem('checkoutCart')) || [];
    let currency = localStorage.getItem('checkoutCurrency') || 'USD';
    let totalUSD = parseFloat(localStorage.getItem('checkoutTotal')) || 0;
    let rubRate = 92;

    // Доставка
    let deliveryCostUSD = 0;
    const deliveryPrices = {
        courier: 5,    // 5 USD = 500 RUB
        pickup: 0,
        post: 3        // 3 USD = 300 RUB
    };

    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderOrderSummary();
    }

    function getPrice(priceUSD) {
        if(currency === 'USD') return { val: priceUSD, sym: '$' };
        return { val: Math.round(priceUSD * rubRate), sym: '₽' };
    }

    function renderOrderSummary() {
        const container = document.getElementById('orderItems');
        if(cart.length === 0) {
            window.location.href = 'index.html';
            return;
        }

        container.innerHTML = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            const price = getPrice(product.price_usd);
            const total = getPrice(product.price_usd * item.quantity);
            return `
                <div class="order-item">
                    <div class="order-item-info">
                        <span class="order-item-img">${product.img}</span>
                        <div>
                            <div style="font-weight:500;">${product.name}</div>
                            <div style="font-size:12px; color:rgba(255,255,255,0.5);">${price.val} ${price.sym} × ${item.quantity}</div>
                        </div>
                    </div>
                    <div style="color:#6C63FF;">${total.val} ${total.sym}</div>
                </div>
            `;
        }).join('');

        const subtotal = getPrice(totalUSD);
        const deliveryTotal = getPrice(deliveryCostUSD);
        const grandTotal = getPrice(totalUSD + deliveryCostUSD);
        
        document.getElementById('subtotal').innerHTML = `${subtotal.val} ${subtotal.sym}`;
        document.getElementById('deliveryCost').innerHTML = deliveryCostUSD === 0 ? 'Бесплатно' : `${deliveryTotal.val} ${deliveryTotal.sym}`;
        document.getElementById('orderTotal').innerHTML = `${grandTotal.val} ${grandTotal.sym}`;
    }

    // Обновление стоимости доставки
    document.getElementById('delivery').onchange = (e) => {
        const deliveryType = e.target.value;
        deliveryCostUSD = deliveryPrices[deliveryType] || 0;
        
        const addressGroup = document.getElementById('addressGroup');
        if(deliveryType === 'pickup') {
            addressGroup.style.display = 'none';
            document.getElementById('address').removeAttribute('required');
        } else {
            addressGroup.style.display = 'block';
            document.getElementById('address').setAttribute('required', 'required');
        }
        
        renderOrderSummary();
    };

    // ========== ОТПРАВКА В TELEGRAM (с вашими данными) ==========
    const BOT_TOKEN = "8958424168:AAHZ2f5oGU81VuTXwJCuEdta7ntFvAOuAfc";
    const CHAT_ID = "-1003951304278";

    async function sendOrderToTelegram(orderData) {
        const message = `
🛒 **НОВЫЙ ЗАКАЗ** 🛒
━━━━━━━━━━━━━━━━━━━

👤 **КЛИЕНТ:**
• ФИО: ${orderData.fullName}
• Телефон: ${orderData.phone}
• Email: ${orderData.email}

📍 **ДОСТАВКА:**
• Способ: ${orderData.delivery}
• Адрес: ${orderData.address || "Самовывоз"}

📦 **ТОВАРЫ:**
${orderData.items}

💰 **ОПЛАТА:**
• Способ: ${orderData.payment}
• Сумма: ${orderData.total}

💬 **КОММЕНТАРИЙ:**
${orderData.comment || "Нет"}

⏰ **Время:** ${new Date().toLocaleString()}
━━━━━━━━━━━━━━━━━━━
#новый_заказ
        `;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });
            const result = await response.json();
            return result.ok;
        } catch(e) {
            console.error('Ошибка отправки:', e);
            return false;
        }
    }

    // Обработка формы
    document.getElementById('checkoutForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const delivery = document.getElementById('delivery').value;
        const address = document.getElementById('address').value;
        const comment = document.getElementById('comment').value;
        const payment = document.querySelector('input[name="payment"]:checked').value;
        
        if(!fullName || !phone || !email || !delivery) {
            alert("Заполните все обязательные поля!");
            return;
        }
        
        if(delivery !== 'pickup' && !address) {
            alert("Укажите адрес доставки!");
            return;
        }
        
        // Формируем список товаров
        const itemsList = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            const price = getPrice(product.price_usd);
            return `• ${product.name} × ${item.quantity} = ${price.val * item.quantity} ${price.sym}`;
        }).join('\n');
        
        const deliveryNames = {
            courier: "🚚 Курьерская доставка",
            pickup: "📦 Самовывоз",
            post: "📮 Почта России"
        };
        
        const paymentNames = {
            card: "💳 Оплата картой онлайн",
            crypto: "🪙 Криптовалюта (USDT)",
            cash: "💵 Наличные при получении"
        };
        
        const grandTotal = getPrice(totalUSD + deliveryCostUSD);
        
        const orderData = {
            fullName: fullName,
            phone: phone,
            email: email,
            delivery: deliveryNames[delivery] || delivery,
            address: address,
            items: itemsList,
            payment: paymentNames[payment],
            total: `${grandTotal.val} ${grandTotal.sym}`,
            comment: comment
        };
        
        // Блокируем кнопку
        const btn = e.target.querySelector('button[type="submit"]') || e.target;
        const originalText = btn.innerText;
        btn.innerText = "⏳ Отправка заказа...";
        btn.disabled = true;
        
        // Отправляем в Telegram
        const sent = await sendOrderToTelegram(orderData);
        
        if(sent) {
            alert("✅ Заказ успешно оформлен!\nНаш менеджер свяжется с вами в ближайшее время.");
            // Очищаем корзину
            localStorage.removeItem('cart');
            localStorage.removeItem('checkoutCart');
            // Перенаправляем
            window.location.href = 'success.html';
        } else {
            alert("❌ Ошибка отправки заказа. Пожалуйста, попробуйте позже.\n\nВаш заказ сохранён.");
            console.log("Данные заказа:", orderData);
            btn.innerText = originalText;
            btn.disabled = false;
        }
    };
    
    fetchRubRate();
    
    // Если корзина пуста - редирект
    if(cart.length === 0) {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
