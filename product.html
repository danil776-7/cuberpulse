<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Товар</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #FFFFFF, #6C63FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .back-link {
            color: #6C63FF;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(108, 99, 255, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
        }

        .cart-count {
            background: #FF4D4D;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 12px;
        }

        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            margin: 40px 0 60px;
        }

        @media (max-width: 800px) {
            .product-container {
                grid-template-columns: 1fr;
            }
        }

        .gallery {
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 20px;
        }

        .main-image {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            font-size: 120px;
            margin-bottom: 20px;
        }

        .thumbnails {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .thumbnail {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .thumbnail.active {
            border-color: #6C63FF;
            background: rgba(108,99,255,0.2);
        }

        .product-info h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .product-price {
            font-size: 36px;
            font-weight: 700;
            color: #6C63FF;
            margin: 20px 0;
        }

        .old-price {
            font-size: 20px;
            color: rgba(255,255,255,0.4);
            text-decoration: line-through;
            margin-left: 12px;
        }

        .product-full-desc {
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin: 20px 0;
        }

        .specs {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }

        .specs ul {
            list-style: none;
            padding-left: 0;
        }

        .specs li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .specs li:before {
            content: "✓";
            color: #6C63FF;
            margin-right: 10px;
        }

        .btn-add-cart {
            width: 100%;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111118;
            border-left: 4px solid #6C63FF;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'">
            <h1>CuberPulse</h1>
        </div>
        <div class="cart-icon" id="cartIcon">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
    </div>

    <a href="index.html" class="back-link">← Вернуться в каталог</a>

    <div class="product-container" id="productContainer"></div>
</div>

<script>
    let product = JSON.parse(localStorage.getItem('currentProduct'));
    let currentImageIndex = 0;
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentCurrency = 'USD';
    let rubRate = 92;

    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderProduct();
    }

    function getPrice(priceUSD) {
        if(currentCurrency === 'USD') return { val: priceUSD, sym: '$' };
        return { val: Math.round(priceUSD * rubRate), sym: '₽' };
    }

    function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').innerText = count;
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function addToCart(id) {
        const existing = cart.find(item => item.id === id);
        if(existing) {
            existing.quantity++;
        } else {
            cart.push({ id: id, quantity: 1 });
        }
        updateCartCount();
        showToast("✓ Добавлено в корзину", "#4ADE80");
    }

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function renderProduct() {
        if(!product) {
            window.location.href = 'index.html';
            return;
        }

        const hasSale = product.salePrice && product.salePrice < product.price_usd;
        const finalPrice = hasSale ? product.salePrice : product.price_usd;
        const price = getPrice(finalPrice);
        const oldPrice = hasSale ? getPrice(product.price_usd) : null;
        
        const images = (product.images && product.images.length) ? product.images : [product.img || '📦', '📦', '🔧'];
        const specs = (product.specs && product.specs.length) ? product.specs : ["Комплектация: устройство, кабель", "Гарантия 12 месяцев"];

        const container = document.getElementById('productContainer');
        container.innerHTML = `
            <div class="gallery">
                <div class="main-image" id="mainImage">${images[0]}</div>
                <div class="thumbnails" id="thumbnails">
                    ${images.map((img, idx) => `<div class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="changeImage(${idx})">${img}</div>`).join('')}
                </div>
            </div>
            <div class="product-info">
                <h1>${product.name}</h1>
                <div class="product-price">
                    ${price.val} ${price.sym}
                    ${oldPrice ? `<span class="old-price">${oldPrice.val} ${oldPrice.sym}</span>` : ''}
                    ${hasSale ? `<span style="background:#FF4D4D; padding:2px 8px; border-radius:20px; font-size:14px; margin-left:12px;">🔥 Скидка</span>` : ''}
                </div>
                <div class="product-full-desc">${product.fullDesc || product.desc}</div>
                <div class="specs">
                    <h3>📋 Характеристики</h3>
                    <ul>
                        ${specs.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                </div>
                <button class="btn-add-cart" onclick="addToCart(${product.id})">🛒 Добавить в корзину</button>
            </div>
        `;
    }

    window.changeImage = function(index) {
        const images = (product.images && product.images.length) ? product.images : [product.img || '📦', '📦', '🔧'];
        currentImageIndex = index;
        document.getElementById('mainImage').innerHTML = images[index];
        document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
            if(i === index) thumb.classList.add('active');
            else thumb.classList.remove('active');
        });
    }

    document.getElementById('cartIcon').onclick = () => {
        window.location.href = 'index.html';
    };

    fetchRubRate();
    updateCartCount();
</script>
</body>
</html>
