<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Админ-панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #FFFFFF, #6C63FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn {
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 40px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
        }

        .admin-panel {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
            margin: 32px 0 60px;
        }

        @media (max-width: 800px) {
            .admin-panel {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 24px;
        }

        .sidebar h3 {
            margin-bottom: 20px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 12px 0;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .sidebar-menu li:hover, .sidebar-menu li.active {
            color: #6C63FF;
        }

        .content {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 24px;
        }

        .content h2 {
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card-admin {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.2s;
        }

        .product-card-admin:hover {
            background: rgba(255,255,255,0.08);
        }

        .product-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .product-img-admin {
            font-size: 48px;
            background: rgba(255,255,255,0.05);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .product-info-admin {
            flex: 1;
        }

        .product-name-admin {
            font-size: 18px;
            font-weight: 600;
        }

        .product-price-admin {
            color: #6C63FF;
            margin-top: 4px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .login-form {
            max-width: 420px;
            margin: 100px auto;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px;
        }

        .login-form h2 {
            margin-bottom: 24px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111118;
            border-left: 4px solid #6C63FF;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .category-badge {
            display: inline-block;
            background: rgba(108,99,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚙️ CuberPulse | Админ-панель</h1></div>
        <div><button class="btn-outline" id="logoutBtn" style="display:none;">🚪 Выйти</button></div>
    </div>

    <!-- Форма входа -->
    <div id="loginSection" class="login-form">
        <h2>🔐 Вход в админ-панель</h2>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="adminLogin" placeholder="admin">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="adminPassword" placeholder="Введите пароль">
        </div>
        <button class="btn" id="loginBtn" style="width:100%;">Войти</button>
        <p style="margin-top: 16px; font-size: 12px; text-align:center; color:rgba(255,255,255,0.5);">
            🔒 Логин: <strong>admin</strong><br>
            📌 Пароль: <strong>admin123</strong>
        </p>
    </div>

    <!-- Админ-панель -->
    <div id="adminSection" class="admin-panel" style="display:none;">
        <div class="sidebar">
            <h3>📋 Меню</h3>
            <ul class="sidebar-menu">
                <li data-tab="products" class="active">📦 Товары</li>
                <li data-tab="add">➕ Добавить товар</li>
                <li data-tab="orders">📋 Заказы</li>
            </ul>
        </div>

        <div class="content">
            <div id="tab-products" class="tab-content">
                <h2>📦 Управление товарами</h2>
                <div id="productsList" class="products-grid"></div>
            </div>

            <div id="tab-add" class="tab-content" style="display:none;">
                <h2 id="formTitle">➕ Добавить товар</h2>
                <form id="productForm">
                    <input type="hidden" id="editId" value="">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Название товара *</label>
                            <input type="text" id="prodName" required>
                        </div>
                        <div class="form-group">
                            <label>Категория *</label>
                            <select id="prodCategory">
                                <option value="devices">📟 Устройства</option>
                                <option value="modules">🔌 Модули</option>
                                <option value="firmware">⚙️ Прошивки</option>
                                <option value="sdr">📻 SDR</option>
                                <option value="guides">📚 Обучение</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Цена (USD) *</label>
                            <input type="number" id="prodPrice" step="1" required>
                        </div>
                        <div class="form-group">
                            <label>Цена со скидкой (USD)</label>
                            <input type="number" id="prodSalePrice" step="1" placeholder="Оставьте пустым">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Иконка / Эмодзи</label>
                        <input type="text" id="prodImg" placeholder="🐬">
                    </div>

                    <div class="form-group">
                        <label>Краткое описание *</label>
                        <textarea id="prodDesc" rows="2" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Характеристики (через запятую)</label>
                        <input type="text" id="prodSpecs" placeholder="OLED экран, Аккумулятор, RFID">
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 20px;">
                        <button type="submit" class="btn">💾 Сохранить товар</button>
                        <button type="button" class="btn-outline" id="cancelEditBtn" onclick="cancelEdit()">Отмена</button>
                    </div>
                </form>
            </div>

            <div id="tab-orders" class="tab-content" style="display:none;">
                <h2>📋 История заказов</h2>
                <div id="ordersList"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let products = [];

    // ========== АВТОРИЗАЦИЯ ==========
    const ADMIN_LOGIN = "admin";
    const ADMIN_PASSWORD = "admin123";

    function checkAuth() {
        const isAuth = localStorage.getItem('admin_auth') === 'true';
        if(isAuth) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'grid';
            document.getElementById('logoutBtn').style.display = 'block';
            loadProducts();
            loadOrders();
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }
    }

    document.getElementById('loginBtn').onclick = () => {
        const login = document.getElementById('adminLogin').value;
        const password = document.getElementById('adminPassword').value;
        if(login === ADMIN_LOGIN && password === ADMIN_PASSWORD) {
            localStorage.setItem('admin_auth', 'true');
            checkAuth();
            showToast("✅ Вход выполнен", "#4ADE80");
        } else {
            showToast("❌ Неверный логин или пароль", "#F87171");
        }
    };

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('admin_auth');
        checkAuth();
        showToast("🔓 Выход выполнен", "#9AA4BF");
    };

    // ========== ЗАГРУЗКА ТОВАРОВ ==========
    function loadProducts() {
        // Загружаем товары из localStorage
        const saved = localStorage.getItem('admin_products');
        if(saved && saved !== 'undefined') {
            try {
                products = JSON.parse(saved);
            } catch(e) {
                products = [];
            }
        }
        
        // Если товаров нет - создаём тестовые
        if(!products || products.length === 0) {
            products = [
                { id: 1, name: "Flipper Zero", price_usd: 169, salePrice: null, category: "devices", img: "🐬", desc: "Мультитул для пентеста: RFID, IR, GPIO, iButton, Sub-GHz.", specs: ["OLED дисплей", "Аккумулятор 2000mAh", "RFID/NFC"] },
                { id: 2, name: "NRF24L01+ модуль", price_usd: 12, salePrice: null, category: "modules", img: "📻", desc: "2.4GHz беспроводной модуль для Flipper Zero.", specs: ["2.4GHz", "Дальность до 100м"] },
                { id: 3, name: "NRF24L01+ PA+LNA", price_usd: 19, salePrice: null, category: "modules", img: "📡", desc: "Усиленный модуль с внешней антенной, дальность до 1000м.", specs: ["2.4GHz", "Дальность до 1000м"] },
                { id: 4, name: "CC1101 модуль", price_usd: 15, salePrice: null, category: "modules", img: "🔘", desc: "Суб-ГГц трансивер 315/433/868/915 МГц.", specs: ["315-915MHz"] },
                { id: 5, name: "ESP8266 NodeMCU", price_usd: 8, salePrice: null, category: "modules", img: "🔵", desc: "Дешёвый WiFi модуль для IoT проектов.", specs: ["WiFi", "Arduino"] },
                { id: 6, name: "ESP32-C3 модуль", price_usd: 12, salePrice: null, category: "modules", img: "🔵", desc: "Современный WiFi + Bluetooth LE модуль.", specs: ["WiFi", "BLE"] },
                { id: 7, name: "Кастомная прошивка Flipper", price_usd: 29, salePrice: null, category: "firmware", img: "⚙️", desc: "Расширенный функционал: новые протоколы, бэкапы.", specs: ["Новые протоколы", "BadUSB"] },
                { id: 8, name: "Marauder для Flipper", price_usd: 24, salePrice: null, category: "firmware", img: "⚙️", desc: "WiFi атаки, Evil Portal, Beacon Spam.", specs: ["WiFi Deauth", "Evil Portal"] },
                { id: 9, name: "RTLSDR v3", price_usd: 35, salePrice: null, category: "sdr", img: "📻", desc: "Бюджетный SDR приёмник 100kHz – 1.7GHz.", specs: ["100kHz-1.7GHz"] },
                { id: 10, name: "Видеокурс по SDR", price_usd: 89, salePrice: null, category: "guides", img: "📚", desc: "Полное руководство по HackRF One: от новичка до эксперта.", specs: ["15 часов видео"] }
            ];
            localStorage.setItem('admin_products', JSON.stringify(products));
        }
        
        renderProductsList();
    }

    // ========== ОТОБРАЖЕНИЕ СПИСКА ТОВАРОВ ==========
    function renderProductsList() {
        const container = document.getElementById('productsList');
        if(!products || products.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">📦 Нет товаров. Нажмите "Добавить товар"</div>';
            return;
        }
        
        container.innerHTML = '';
        products.forEach(p => {
            const displayPrice = p.salePrice ? `${p.salePrice}$ (было ${p.price_usd}$)` : `${p.price_usd}$`;
            const categoryName = getCategoryName(p.category);
            const card = document.createElement('div');
            card.className = 'product-card-admin';
            card.innerHTML = `
                <div class="product-header">
                    <div class="product-img-admin">${p.img || '📦'}</div>
                    <div class="product-info-admin">
                        <div class="product-name-admin">${escapeHtml(p.name)}</div>
                        <div class="product-price-admin">💰 ${displayPrice}</div>
                        <div class="category-badge">${categoryName}</div>
                    </div>
                </div>
                <div class="product-actions">
                    <button class="btn-outline btn-small" onclick="editProduct(${p.id})">✏️ Редактировать</button>
                    <button class="btn-outline btn-small" onclick="deleteProduct(${p.id})" style="border-color:#F87171; color:#F87171;">🗑️ Удалить</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function getCategoryName(catId) {
        const categories = {
            devices: "📟 Устройства",
            modules: "🔌 Модули",
            firmware: "⚙️ Прошивки",
            sdr: "📻 SDR",
            guides: "📚 Обучение"
        };
        return categories[catId] || catId;
    }

    function escapeHtml(text) {
        if(!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== ДОБАВЛЕНИЕ/РЕДАКТИРОВАНИЕ ТОВАРА ==========
    window.editProduct = function(id) {
        const product = products.find(p => p.id === id);
        if(!product) return;
        
        document.getElementById('formTitle').innerHTML = '✏️ Редактировать товар';
        document.getElementById('editId').value = id;
        document.getElementById('prodName').value = product.name;
        document.getElementById('prodPrice').value = product.price_usd;
        document.getElementById('prodSalePrice').value = product.salePrice || '';
        document.getElementById('prodCategory').value = product.category;
        document.getElementById('prodImg').value = product.img || '';
        document.getElementById('prodDesc').value = product.desc;
        document.getElementById('prodSpecs').value = (product.specs || []).join(', ');
        
        // Переключаемся на вкладку добавления
        document.querySelector('[data-tab="add"]').click();
    };

    window.cancelEdit = function() {
        document.getElementById('formTitle').innerHTML = '➕ Добавить товар';
        document.getElementById('productForm').reset();
        document.getElementById('editId').value = '';
    };

    // Сохранение товара
    document.getElementById('productForm').onsubmit = (e) => {
        e.preventDefault();
        
        const specs = document.getElementById('prodSpecs').value.split(',').map(s => s.trim()).filter(s => s);
        
        const productData = {
            name: document.getElementById('prodName').value.trim(),
            price_usd: parseInt(document.getElementById('prodPrice').value),
            salePrice: document.getElementById('prodSalePrice').value ? parseInt(document.getElementById('prodSalePrice').value) : null,
            category: document.getElementById('prodCategory').value,
            img: document.getElementById('prodImg').value.trim() || '📦',
            desc: document.getElementById('prodDesc').value.trim(),
            specs: specs
        };
        
        const editId = document.getElementById('editId').value;
        if(editId) {
            // Обновление существующего товара
            const index = products.findIndex(p => p.id == editId);
            if(index !== -1) {
                productData.id = parseInt(editId);
                products[index] = productData;
            }
        } else {
            // Новый товар
            productData.id = Date.now();
            products.push(productData);
        }
        
        localStorage.setItem('admin_products', JSON.stringify(products));
        renderProductsList();
        cancelEdit();
        showToast("✅ Товар сохранён", "#4ADE80");
        document.querySelector('[data-tab="products"]').click();
    };

    // Удаление товара
    window.deleteProduct = function(id) {
        const product = products.find(p => p.id === id);
        if(confirm(`Удалить товар "${product.name}"?`)) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('admin_products', JSON.stringify(products));
            renderProductsList();
            showToast("🗑️ Товар удалён", "#F87171");
        }
    };

    // ========== ЗАГРУЗКА ЗАКАЗОВ ==========
    function loadOrders() {
        const container = document.getElementById('ordersList');
        const savedOrders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        
        if(savedOrders.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">📋 Нет заказов</div>';
            return;
        }

        container.innerHTML = '';
        savedOrders.reverse().forEach((order, index) => {
            const card = document.createElement('div');
            card.className = 'product-card-admin';
            card.innerHTML = `
                <div class="product-header">
                    <div class="product-img-admin" style="font-size:32px;">👤</div>
                    <div class="product-info-admin">
                        <div class="product-name-admin">${escapeHtml(order.fullName)}</div>
                        <div>📞 ${escapeHtml(order.phone)}</div>
                        <div>📧 ${escapeHtml(order.email)}</div>
                        <div>📍 ${escapeHtml(order.city)}, ${escapeHtml(order.address)}</div>
                        <div>📦 ${escapeHtml(order.delivery)}</div>
                        <div>💰 ${escapeHtml(order.total)}</div>
                        <div style="font-size:12px; color:rgba(255,255,255,0.5);">⏰ ${new Date(order.savedAt).toLocaleString()}</div>
                    </div>
                </div>
                <div class="product-actions">
                    <button class="btn-outline btn-small" onclick="copyOrder(${index})">📋 Копировать</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.copyOrder = function(index) {
        const orders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        const order = orders.reverse()[index];
        const text = `Заказ: ${order.fullName}\nТелефон: ${order.phone}\nАдрес: ${order.city}, ${order.address}\nСумма: ${order.total}`;
        navigator.clipboard.writeText(text);
        showToast("📋 Заказ скопирован", "#4ADE80");
    };

    // ========== ВКЛАДКИ ==========
    document.querySelectorAll('.sidebar-menu li').forEach(item => {
        item.onclick = () => {
            document.querySelectorAll('.sidebar-menu li').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            const tab = item.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(`tab-${tab}`).style.display = 'block';
            if(tab === 'orders') loadOrders();
            if(tab === 'products') renderProductsList();
        };
    });

    // ========== TOAST ==========
    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    checkAuth();
</script>
</body>
</html>
