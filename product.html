<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Оформление заказа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #FFFFFF, #6C63FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .back-link {
            color: #6C63FF;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            margin: 40px 0 60px;
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
        }

        .form-section h2 {
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6C63FF;
        }

        .order-summary {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .order-summary h3 {
            margin-bottom: 20px;
        }

        .order-items {
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .order-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-item-img {
            font-size: 32px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            font-size: 20px;
            font-weight: 700;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 16px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .payment-options {
            background: rgba(108, 99, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
        }

        .payment-options label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin: 8px 0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111118;
            border-left: 4px solid #6C63FF;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .contact-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            background: #111118;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 32px;
            z-index: 2000;
            text-align: center;
        }

        .contact-modal.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .contact-link {
            display: inline-block;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            margin: 8px 0;
        }

        .close-contact {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1999;
        }

        .overlay.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        select option {
            background: #1A1A2E;
            color: white;
        }
    </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="contact-modal" id="contactModal">
    <div style="font-size: 50px; margin-bottom: 16px;">✅</div>
    <h3>Заказ оформлен!</h3>
    <p>Для подтверждения и оплаты свяжитесь с менеджером:</p>
    <a href="https://t.me/cuberpulse" target="_blank" class="contact-link">📱 Написать менеджеру</a>
    <p style="font-size: 12px;">@cuberpulse</p>
    <button class="close-contact" onclick="closeContactModal()">Закрыть</button>
</div>

<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'">
            <h1>CuberPulse</h1>
        </div>
    </div>

    <a href="index.html" class="back-link">← Вернуться в каталог</a>

    <div class="checkout-container">
        <div class="form-section">
            <h2>📋 Данные для доставки</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>ФИО *</label>
                    <input type="text" id="fullName" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="phone" required placeholder="+7 999 123-45-67" maxlength="18">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Способ доставки *</label>
                    <select id="delivery" required>
                        <option value="" disabled selected>-- Выберите способ доставки --</option>
                        <option value="cdek">📦 CDEK (500 ₽)</option>
                        <option value="dhl">✈️ DHL Express (1500 ₽)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Город *</label>
                    <input type="text" id="city" required placeholder="Москва, Санкт-Петербург">
                </div>
                <div class="form-group">
                    <label>Адрес *</label>
                    <textarea id="address" rows="2" required placeholder="Улица, дом, квартира"></textarea>
                </div>
                <div class="form-group">
                    <label>Индекс *</label>
                    <input type="text" id="zip" required placeholder="123456" maxlength="6">
                </div>
                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea id="comment" rows="2" placeholder="Дополнительная информация"></textarea>
                </div>

                <div class="payment-options">
                    <p style="margin-bottom: 12px;">💳 Способы оплаты:</p>
                    <label>
                        <input type="radio" name="payment" value="card" checked> Оплата картой онлайн
                    </label>
                    <label>
                        <input type="radio" name="payment" value="crypto"> Криптовалюта (USDT)
                    </label>
                </div>

                <button type="submit" class="btn-submit">✅ Оформить заказ</button>
            </form>
        </div>

        <div class="order-summary">
            <h3>🛒 Ваш заказ</h3>
            <div id="orderItems" class="order-items"></div>
            <div class="total-row"><span>Сумма:</span><span id="subtotal">0 $</span></div>
            <div class="total-row" style="border-top:none;"><span>Доставка:</span><span id="deliveryCost">0 $</span></div>
            <div class="total-row"><span>Итого:</span><span id="orderTotal" style="color:#6C63FF; font-size:24px;">0 $</span></div>
        </div>
    </div>
</div>

<script>
    // ========== ТОВАРЫ ==========
    const products = [
        { id: 1, name: "Flipper Zero", price_usd: 169, img: "images/flipper-zero.jpg" },
        { id: 2, name: "HackRF One", price_usd: 299, img: "images/hackrf-one.jpg" },
        { id: 3, name: "HackRF One Portapack H2", price_usd: 429, img: "images/hackrf-portapack.jpg" },
        { id: 4, name: "Raspberry Pi 4 (4GB)", price_usd: 75, img: "images/raspberry-pi4.jpg" },
        { id: 5, name: "Raspberry Pi 4 (8GB)", price_usd: 95, img: "images/raspberry-pi4.jpg" },
        { id: 6, name: "Raspberry Pi 5 (4GB)", price_usd: 89, img: "images/raspberry-pi5.jpg" },
        { id: 7, name: "Raspberry Pi 5 (8GB)", price_usd: 119, img: "images/raspberry-pi5.jpg" },
        { id: 8, name: "UConsole (портативная консоль)", price_usd: 189, img: "images/uconsole.jpg" },
        { id: 9, name: "UConsole DIY Kit", price_usd: 149, img: "images/uconsole-diy.jpg" },
        { id: 10, name: "NRF24L01+ модуль", price_usd: 12, img: "images/nrf24l01.jpg" },
        { id: 11, name: "NRF24L01+ PA+LNA", price_usd: 19, img: "images/nrf24l01-pa.jpg" },
        { id: 12, name: "CC1101 модуль", price_usd: 15, img: "images/cc1101.jpg" },
        { id: 13, name: "ESP8266 WiFi модуль", price_usd: 8, img: "images/esp8266.jpg" },
        { id: 14, name: "ESP32-C3 WiFi/BLE", price_usd: 12, img: "images/esp32-c3.jpg" },
        { id: 15, name: "ESP32-S3 модуль", price_usd: 15, img: "images/esp32-s3.jpg" },
        { id: 16, name: "DIV GPIO расширитель", price_usd: 18, img: "images/div-gpio.jpg" },
        { id: 17, name: "DIV RFID/NFC модуль", price_usd: 22, img: "images/div-rfid.jpg" },
        { id: 18, name: "Антенна для Flipper", price_usd: 25, img: "images/antenna-flipper.jpg" },
        { id: 19, name: "Антенна для HackRF", price_usd: 42, img: "images/antenna-hackrf.jpg" },
        { id: 20, name: "Кастомная прошивка Flipper", price_usd: 29, img: "images/firmware-custom.jpg" },
        { id: 21, name: "Marauder прошивка", price_usd: 24, img: "images/firmware-marauder.jpg" },
        { id: 22, name: "RogueMaster прошивка", price_usd: 34, img: "images/firmware-rogue.jpg" },
        { id: 23, name: "Xtreme прошивка", price_usd: 39, img: "images/firmware-xtreme.jpg" },
        { id: 24, name: "Видеокурс по SDR", price_usd: 89, img: "images/course-sdr.jpg" }
    ];

    // ========== ЗАГРУЗКА ДАННЫХ ИЗ LOCALSTORAGE ==========
    let cart = [];
    let currency = 'USD';
    let totalUSD = 0;
    let rubRate = 92;
    let deliveryCostUSD = 0;
    const deliveryPrices = { cdek: 5, dhl: 15 };
    const deliveryNames = { cdek: "📦 CDEK", dhl: "✈️ DHL Express" };

    function loadCheckoutData() {
        try {
            const savedCart = localStorage.getItem('checkoutCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            
            const savedCurrency = localStorage.getItem('checkoutCurrency');
            if (savedCurrency) {
                currency = savedCurrency;
            }
            
            const savedTotal = localStorage.getItem('checkoutTotal');
            if (savedTotal) {
                totalUSD = parseFloat(savedTotal) || 0;
            }
        } catch(e) {
            console.error('Ошибка загрузки данных:', e);
        }
        
        console.log('Загружено товаров в корзине:', cart.length);
        console.log('Сумма:', totalUSD);
    }

    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderOrderSummary();
    }

    function getPrice(priceUSD) {
        if(currency === 'USD') return { val: priceUSD, sym: '$' };
        return { val: Math.round(priceUSD * rubRate), sym: '₽' };
    }

    function renderOrderSummary() {
        const container = document.getElementById('orderItems');
        if (!cart || cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:rgba(255,255,255,0.5);">Корзина пуста</div>';
            document.getElementById('subtotal').innerHTML = '0 $';
            document.getElementById('deliveryCost').innerHTML = '0 $';
            document.getElementById('orderTotal').innerHTML = '0 $';
            return;
        }

        container.innerHTML = cart.map(item => {
            const p = products.find(p => p.id === item.id);
            if (!p) return '';
            const price = getPrice(p.price_usd);
            const total = getPrice(p.price_usd * item.quantity);
            return `
                <div class="order-item">
                    <div class="order-item-info">
                        <span class="order-item-img">${p.img ? '📦' : '📦'}</span>
                        <div>
                            <strong>${escapeHtml(p.name)}</strong>
                            <div style="font-size:12px; color:rgba(255,255,255,0.5);">${price.val} ${price.sym} × ${item.quantity}</div>
                        </div>
                    </div>
                    <div>${total.val} ${total.sym}</div>
                </div>
            `;
        }).join('');

        const subtotal = getPrice(totalUSD);
        const delivery = getPrice(deliveryCostUSD);
        const total = getPrice(totalUSD + deliveryCostUSD);
        
        document.getElementById('subtotal').innerHTML = `${subtotal.val} ${subtotal.sym}`;
        document.getElementById('deliveryCost').innerHTML = deliveryCostUSD === 0 ? 'Бесплатно' : `${delivery.val} ${delivery.sym}`;
        document.getElementById('orderTotal').innerHTML = `${total.val} ${total.sym}`;
    }

    document.getElementById('delivery').onchange = (e) => {
        deliveryCostUSD = deliveryPrices[e.target.value] || 0;
        renderOrderSummary();
    };

    // ========== ОТПРАВКА В TELEGRAM ==========
    const BOT_TOKEN = "8958424168:AAHZ2f5oGU81VuTXwJCuEdta7ntFvAOuAfc";
    const CHAT_ID = "-1003951304278";

    async function sendOrderToTelegram(orderData) {
        const message = `🛒 НОВЫЙ ЗАКАЗ 🛒
━━━━━━━━━━━━━━━━━━━

👤 КЛИЕНТ:
ФИО: ${orderData.fullName}
Телефон: ${orderData.phone}
Email: ${orderData.email}

📍 ДОСТАВКА:
Способ: ${orderData.delivery}
Город: ${orderData.city}
Адрес: ${orderData.address}
Индекс: ${orderData.zip}

📦 ТОВАРЫ:
${orderData.items}

💰 ОПЛАТА:
Способ: ${orderData.payment}
Сумма: ${orderData.total}

💬 КОММЕНТАРИЙ:
${orderData.comment || "Нет"}

⏰ Время: ${new Date().toLocaleString()}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            return data.ok;
        } catch(e) {
            console.error('Ошибка отправки в Telegram:', e);
            return false;
        }
    }

    function saveOrderLocally(orderData) {
        const orders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        orders.push({
            ...orderData,
            savedAt: new Date().toISOString()
        });
        localStorage.setItem('saved_orders', JSON.stringify(orders));
        console.log('Заказ сохранён локально');
    }

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function openContactModal() {
        document.getElementById('contactModal').classList.add('show');
        document.getElementById('overlay').classList.add('show');
    }

    function closeContactModal() {
        document.getElementById('contactModal').classList.remove('show');
        document.getElementById('overlay').classList.remove('show');
        window.location.href = 'index.html';
    }

    window.closeContactModal = closeContactModal;

    // ========== ОБРАБОТКА ФОРМЫ ==========
    document.getElementById('checkoutForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const delivery = document.getElementById('delivery').value;
        const city = document.getElementById('city').value.trim();
        const address = document.getElementById('address').value.trim();
        const zip = document.getElementById('zip').value.trim();
        const comment = document.getElementById('comment').value.trim();
        const payment = document.querySelector('input[name="payment"]:checked').value;
        
        // Валидация
        if (!fullName) { showToast("Введите ФИО", "#F87171"); return; }
        if (!phone) { showToast("Введите телефон", "#F87171"); return; }
        if (!email) { showToast("Введите Email", "#F87171"); return; }
        if (!delivery) { showToast("Выберите способ доставки", "#F87171"); return; }
        if (!city) { showToast("Введите город", "#F87171"); return; }
        if (!address) { showToast("Введите адрес", "#F87171"); return; }
        if (!zip) { showToast("Введите индекс", "#F87171"); return; }
        
        // Проверка телефона
        const phoneDigits = phone.replace(/\D/g, '');
        if (phoneDigits.length !== 11) {
            showToast("Неверный номер телефона", "#F87171");
            return;
        }
        
        // Формируем список товаров
        const itemsList = cart.map(item => {
            const p = products.find(pp => pp.id === item.id);
            if (!p) return '';
            const price = getPrice(p.price_usd);
            return `• ${p.name} × ${item.quantity} = ${price.val * item.quantity} ${price.sym}`;
        }).filter(Boolean).join('\n');
        
        const paymentNames = {
            card: "💳 Оплата картой онлайн",
            crypto: "🪙 Криптовалюта (USDT)"
        };
        
        const total = getPrice(totalUSD + deliveryCostUSD);
        const orderData = {
            fullName,
            phone,
            email,
            delivery: deliveryNames[delivery] || delivery,
            city,
            address,
            zip,
            items: itemsList,
            payment: paymentNames[payment] || payment,
            total: `${total.val} ${total.sym}`,
            comment
        };
        
        // Блокируем кнопку
        const btn = document.querySelector('.btn-submit');
        btn.disabled = true;
        btn.innerText = "⏳ Отправка...";
        
        // Отправляем в Telegram
        const sent = await sendOrderToTelegram(orderData);
        
        if (!sent) {
            saveOrderLocally(orderData);
        }
        
        // Очищаем корзину
        localStorage.removeItem('cart');
        localStorage.removeItem('checkoutCart');
        
        showToast("✅ Заказ оформлен!", "#4ADE80");
        
        setTimeout(() => {
            openContactModal();
            btn.disabled = false;
            btn.innerText = "✅ Оформить заказ";
        }, 1000);
    };

    // ========== ЗАПУСК ==========
    loadCheckoutData();
    fetchRubRate();
    
    // Если корзина пуста - редирект
    if (!cart || cart.length === 0) {
        // Не редиректим, чтобы пользователь мог увидеть сообщение
        console.log('Корзина пуста');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
