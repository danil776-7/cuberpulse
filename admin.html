    <style>

        .container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 12px; }
        .logo h1 { font-size: 22px; background: linear-gradient(135deg, #FFFFFF, #6C63FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn { background: linear-gradient(135deg, #6C63FF, #4A42D0); border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; transition: all 0.2s; font-size: 14px; font-weight: 600; }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); padding: 10px 18px; border-radius: 40px; color: rgba(255,255,255,0.8); cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-outline:hover { border-color: #6C63FF; color: #6C63FF; }

        .btn-danger { border-color: #F87171; color: #F87171; }

        .sidebar h3 { margin-bottom: 16px; font-size: 16px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { padding: 12px 0; cursor: pointer; color: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; font-size: 14px; }
        .sidebar-menu li:hover, .sidebar-menu li.active { color: #6C63FF; }
        .sidebar-menu li:last-child { border-bottom: none; }
        
        .content { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; min-width: 0; }
        .content h2 { margin-bottom: 20px; font-size: 20px; }
        
        .form-group { margin-bottom: 16px; }

        .login-form { max-width: 400px; margin: 60px auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 32px 24px; }
        .login-form h2 { margin-bottom: 20px; text-align: center; font-size: 20px; }
        
        .toast { position: fixed; bottom: 24px; right: 16px; left: 16px; max-width: 400px; margin-left: auto; background: #111118; border-left: 4px solid #6C63FF; padding: 14px 18px; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; font-size: 14px; }

        .category-badge { display: inline-block; background: rgba(108, 99, 255, 0.2); padding: 3px 8px; border-radius: 20px; font-size: 10px; margin-top: 4px; }
        .spec-item { display: flex; gap: 8px; margin-bottom: 8px; }

        .add-spec-btn { background: rgba(108, 99, 255, 0.2); border: 1px dashed #6C63FF; padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; color: white; }
        
        .order-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
        .order-header { display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .order-status { padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        .order-status.new { background: #3B82F6; }
        .order-status.processing { background: #FBBF24; color: #000; }
        .order-status.delivered { background: #4ADE80; color: #000; }

        .attempt-warning { background: rgba(251,191,36,0.1); border: 1px solid #FBBF24; border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 12px; color: #FBBF24; }

        }

<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>⚙️ CuberPulse | Админ-панель</h1></div>
        <div><button class="btn-outline" id="logoutBtn" style="display:none;">🚪 Выйти</button></div>
    </div>

    <div id="loginSection" class="login-form">

        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="adminPassword" placeholder="Введите пароль" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn" style="width:100%;">Войти</button>
        <div id="attemptWarning" class="attempt-warning" style="display:none;"></div>
    </div>

    <div id="adminSection" class="admin-panel" style="display:none;">
        <div class="sidebar">
            <h3>📋 Меню</h3>
            <ul class="sidebar-menu">
                <li data-tab="products" class="active">📦 Товары</li>
                <li data-tab="add">➕ Добавить</li>
                <li data-tab="orders">📋 Заказы</li>
            </ul>
        </div>

        <div class="content">
            <div id="tab-products" class="tab-content">
                <h2>📦 Управление товарами</h2>
                <div class="warning-box">
                    ⚠️ <strong>Важно:</strong> Фото берутся из корня репозитория (.png).
                    <button class="btn-reset" onclick="resetProducts()">🔄 Обновить товары</button>
                </div>
                <div id="productsList" class="products-grid"></div>
            </div>

            <div id="tab-add" class="tab-content" style="display:none;">
                <h2 id="formTitle">➕ Добавить товар</h2>
                <form id="productForm">
                    <input type="hidden" id="editId" value="">
                    <div class="form-row">
                        <div class="form-group"><label>Название товара *</label><input type="text" id="prodName" required maxlength="100"></div>
                        <div class="form-group"><label>Категория *</label>
                            <select id="prodCategory">
                                <option value="devices">📟 Устройства</option>
                                <option value="modules">🔌 Модули</option>
                                <option value="firmware">⚙️ Прошивки</option>
                                <option value="accessories">🔧 Аксессуары</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Цена ОТ (USD) *</label><input type="number" id="prodPrice" step="1" required min="0" max="999999"></div>
                        <div class="form-group"><label>Цена ДО (USD)</label><input type="number" id="prodPriceMax" step="1" min="0" max="999999" placeholder="Если одна цена — оставьте пустым"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Скидка ОТ (USD)</label><input type="number" id="prodSalePrice" step="1" min="0" max="999999"></div>

                    <div class="form-group"><label>Характеристики</label><div id="specsContainer"></div><button type="button" class="add-spec-btn" onclick="addSpecField()">+ Добавить характеристику</button></div>

<script>
    // ========== ЗАЩИТА: Санитизация ==========
    function sanitizeInput(str, maxLength = 200) {
        if (!str) return '';
        return String(str).slice(0, maxLength).replace(/[<>"'&]/g, function(char) {
            const map = { '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '&': '&amp;' };
            return map[char];
        });
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== ЗАЩИТА: Хеширование пароля SHA-256 ==========
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Хеш от "admin" и "admin123"
    const ADMIN_LOGIN_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
    const ADMIN_PASSWORD_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";

    let products = [];
    const MAX_ATTEMPTS = 3;
    const LOCKOUT_TIME = 60000;
    let failedAttempts = 0;
    let lockoutUntil = 0;

    // ========== ЗАЩИТА: Проверка авторизации при загрузке ==========
    function checkAuth() {
        const authData = localStorage.getItem('admin_auth_v2');
        if (!authData) return false;
        
        try {
            const parsed = JSON.parse(atob(authData));
            if (parsed.expires < Date.now()) {
                localStorage.removeItem('admin_auth_v2');
                return false;
            }
            return true;
        } catch(e) {
            localStorage.removeItem('admin_auth_v2');
            return false;
        }
    }

    function setAuth() {
        const auth = {
            expires: Date.now() + (2 * 60 * 60 * 1000)
        };
        localStorage.setItem('admin_auth_v2', btoa(JSON.stringify(auth)));
    }

    function checkAuthUI() {
        if (checkAuth()) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'grid';
            document.getElementById('logoutBtn').style.display = 'block';
            loadProducts();
            loadOrders();
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }
    }

    document.getElementById('loginBtn').onclick = async () => {
        // Проверка блокировки
        if (lockoutUntil > Date.now()) {
            const sec = Math.ceil((lockoutUntil - Date.now()) / 1000);
            showToast(`⏳ Подождите ${sec} сек`, "#F87171");
            return;
        }

        const login = document.getElementById('adminLogin').value.trim();
        const password = document.getElementById('adminPassword').value;

        if (!login || !password) {
            showToast("❌ Введите логин и пароль", "#F87171");
            return;
        }

        const loginHash = await sha256(login);
        const passwordHash = await sha256(password);

        if (loginHash === ADMIN_LOGIN_HASH && passwordHash === ADMIN_PASSWORD_HASH) {
            failedAttempts = 0;
            setAuth();
            checkAuthUI();
            showToast("✅ Вход выполнен", "#4ADE80");
            document.getElementById('adminPassword').value = '';
            document.getElementById('attemptWarning').style.display = 'none';
        } else {
            failedAttempts++;
            if (failedAttempts >= MAX_ATTEMPTS) {
                lockoutUntil = Date.now() + LOCKOUT_TIME;
                failedAttempts = 0;
                document.getElementById('attemptWarning').style.display = 'block';
                document.getElementById('attemptWarning').innerHTML = `🔒 Слишком много попыток. Блокировка на 60 секунд.`;
                showToast("🔒 Заблокировано на 60 сек", "#F87171");
            } else {
                const remaining = MAX_ATTEMPTS - failedAttempts;
                document.getElementById('attemptWarning').style.display = 'block';
                document.getElementById('attemptWarning').innerHTML = `⚠️ Неверный пароль. Осталось попыток: ${remaining}`;
                showToast(`❌ Неверный пароль. Осталось: ${remaining}`, "#F87171");
            }
        }
    };

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('admin_auth_v2');
        checkAuthUI();
        showToast("🔓 Выход выполнен", "#9AA4BF");
    };

    // Enter для входа
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

        { id: 12, name: "ESP32 Wi-Fi Module", price_usd: 150, price_usd_max: null, salePrice: null, salePriceMax: null, category: "modules", img: "esp32-wifi.png", desc: "ESP32 Wi-Fi модуль.", fullDesc: "ESP32 Wi-Fi Module.", specs: ["2.4 GHz", "ESP32", "Сканирование сетей"] },
        { id: 13, name: "Кастомная прошивка", price_usd: 50, price_usd_max: null, salePrice: null, salePriceMax: null, category: "firmware", img: "custom-firmware.png", desc: "Больше возможностей Flipper Zero.", fullDesc: "Кастомная прошивка.", specs: ["Unleashed", "RogueMaster", "Momentum", "Xtreme"] },
        { id: 14, name: "BadUSB для Flipper Zero", price_usd: 80, price_usd_max: null, salePrice: null, salePriceMax: null, category: "accessories", img: "badusb.png", desc: "Автоматизация задач через USB.", fullDesc: "BadUSB для Flipper Zero.", specs: ["Выполнение скриптов", "Payload'ы", "Для обучения"] }
    ];

    function loadProducts() {
        products = JSON.parse(JSON.stringify(FIXED_PRODUCTS));
        localStorage.setItem('admin_products', JSON.stringify(products));
        renderProductsList();
    }

    window.resetProducts = function() {
        if (confirm('Обновить товары из встроенного списка?')) {
            localStorage.removeItem('admin_products');
            loadProducts();
            showToast("✅ Товары обновлены", "#4ADE80");
        }
    };

    function renderProductsList() {
        const container = document.getElementById('productsList');
        if (!products || products.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>Нет товаров</p></div>`;
            return;
        }

        container.innerHTML = '';
        products.forEach(p => {
            let displayPrice;
            if (p.salePrice) {
                displayPrice = p.salePriceMax ? `${p.salePrice}$ – ${p.salePriceMax}$` : `${p.salePrice}$`;
            } else {
                displayPrice = p.price_usd_max ? `${p.price_usd}$ – ${p.price_usd_max}$` : `${p.price_usd}$`;
            }
            const categoryName = getCategoryName(p.category);

            const card = document.createElement('div');
            card.className = 'product-card-admin';
            card.innerHTML = `
                <div class="product-header">
                    <div class="product-img-admin">
                        <img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>📦</span>';">
                    </div>
                    <div class="product-info-admin">
                        <div class="product-name-admin">${escapeHtml(p.name)}</div>
                        <div class="product-price-admin">💰 ${displayPrice}</div>
                        <div class="category-badge">${categoryName}</div>
                    </div>
                </div>
                <div class="product-actions">
                    <button class="btn-outline btn-small" onclick="editProduct(${p.id})">✏️ Редактировать</button>
                    <button class="btn-outline btn-small btn-danger" onclick="deleteProduct(${p.id})">🗑️ Удалить</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function getCategoryName(catId) {
        const categories = { devices: "📟 Устройства", modules: "🔌 Модули", firmware: "⚙️ Прошивки", accessories: "🔧 Аксессуары" };
        return categories[catId] || catId;
    }

    window.editProduct = function (id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        document.getElementById('formTitle').innerHTML = '✏️ Редактировать товар';
        document.getElementById('editId').value = id;
        document.getElementById('prodName').value = product.name;
        document.getElementById('prodPrice').value = product.price_usd;
        document.getElementById('prodPriceMax').value = product.price_usd_max || '';
        document.getElementById('prodSalePrice').value = product.salePrice || '';
        document.getElementById('prodSalePriceMax').value = product.salePriceMax || '';
        document.getElementById('prodCategory').value = product.category;
        document.getElementById('prodDesc').value = product.desc;
        document.getElementById('prodFullDesc').value = product.fullDesc || '';
        document.getElementById('prodImg').value = product.img || '';

        const specsContainer = document.getElementById('specsContainer');
        specsContainer.innerHTML = '';
        if (product.specs && product.specs.length) {
            product.specs.forEach(spec => addSpecField(spec));
        } else {
            addSpecField('');
        }

        document.querySelector('[data-tab="add"]').click();
    };

    window.cancelEdit = function () {
        document.getElementById('formTitle').innerHTML = '➕ Добавить товар';
        document.getElementById('productForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('specsContainer').innerHTML = '';
        addSpecField('');
    };

    window.addSpecField = function (value = '') {
        const container = document.getElementById('specsContainer');
        const div = document.createElement('div');
        div.className = 'spec-item';
        div.innerHTML = `
            <input type="text" class="spec-input" value="${escapeHtml(value)}" placeholder="Например: OLED экран" maxlength="100">
            <button type="button" class="btn-outline btn-small btn-danger" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(div);
    };

    document.getElementById('productForm').onsubmit = (e) => {
        e.preventDefault();
        const specs = [];
        document.querySelectorAll('.spec-input').forEach(input => {
            const val = sanitizeInput(input.value.trim(), 100);
            if (val) specs.push(val);
        });

        const productData = {
            name: sanitizeInput(document.getElementById('prodName').value.trim(), 100),
            price_usd: parseInt(document.getElementById('prodPrice').value),
            price_usd_max: document.getElementById('prodPriceMax').value ? parseInt(document.getElementById('prodPriceMax').value) : null,
            salePrice: document.getElementById('prodSalePrice').value ? parseInt(document.getElementById('prodSalePrice').value) : null,
            salePriceMax: document.getElementById('prodSalePriceMax').value ? parseInt(document.getElementById('prodSalePriceMax').value) : null,
            category: document.getElementById('prodCategory').value,
            img: sanitizeInput(document.getElementById('prodImg').value.trim(), 100) || '📦',
            desc: sanitizeInput(document.getElementById('prodDesc').value.trim(), 500),
            fullDesc: sanitizeInput(document.getElementById('prodFullDesc').value.trim(), 2000),
            specs: specs
        };

        if (!productData.name || !productData.desc) {
            showToast("❌ Заполните обязательные поля", "#F87171");
            return;
        }

        const editId = document.getElementById('editId').value;
        if (editId) {
            const index = products.findIndex(p => p.id == editId);
            if (index !== -1) {
                productData.id = parseInt(editId);
                products[index] = productData;
            }
        } else {
            productData.id = Date.now();
            products.push(productData);
        }

        localStorage.setItem('admin_products', JSON.stringify(products));
        renderProductsList();
        cancelEdit();
        showToast("✅ Товар сохранён", "#4ADE80");
        document.querySelector('[data-tab="products"]').click();
    };

    window.deleteProduct = function (id) {
        const product = products.find(p => p.id === id);
        if (!product) return;
        if (confirm(`Удалить товар "${product.name}"?`)) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('admin_products', JSON.stringify(products));
            renderProductsList();
            showToast("🗑️ Товар удалён", "#F87171");
        }
    };

    function loadOrders() {
        const container = document.getElementById('ordersList');
        const savedOrders = JSON.parse(localStorage.getItem('saved_orders') || '[]');

        if (savedOrders.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>Нет заказов</p></div>`;
            return;
        }

        container.innerHTML = '';
        savedOrders.slice().reverse().forEach((order, index) => {
            const statusClass = order.status || 'new';
            const statusText = { new: '🆕 Новый', processing: '🔄 В обработке', delivered: '✅ Доставлен', cancelled: '❌ Отменён' }[statusClass] || '🆕 Новый';

            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div class="order-header">
                    <div style="min-width:0;flex:1;">
                        <strong>👤 ${escapeHtml(order.fullName)}</strong>
                        <div style="font-size:12px;">📞 ${escapeHtml(order.phone)}</div>
                        <div style="font-size:12px;">📧 ${escapeHtml(order.email)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="order-status ${statusClass}">${statusText}</div>
                        <div style="font-size:12px; margin-top:4px;">💰 ${escapeHtml(order.total)}</div>
                    </div>
                </div>
                <div style="font-size:12px; color:rgba(255,255,255,0.5);">
                    📍 ${escapeHtml(order.city)}, ${escapeHtml(order.address)}<br>
                    📦 ${escapeHtml(order.delivery)}<br>
                    ⏰ ${new Date(order.savedAt).toLocaleString()}
                </div>
                <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
                    <button class="btn-outline btn-small" onclick="updateOrderStatus(${index}, 'processing')">🔄 Обработка</button>
                    <button class="btn-outline btn-small" onclick="updateOrderStatus(${index}, 'delivered')">✅ Доставлен</button>
                    <button class="btn-outline btn-small btn-danger" onclick="updateOrderStatus(${index}, 'cancelled')">❌ Отменить</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.updateOrderStatus = function (index, status) {
        const orders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        const originalIndex = orders.length - 1 - index;
        if (orders[originalIndex]) {
            orders[originalIndex].status = status;
            localStorage.setItem('saved_orders', JSON.stringify(orders));
            loadOrders();
            showToast("✅ Статус обновлён", "#4ADE80");
        }
    };

    document.querySelectorAll('.sidebar-menu li').forEach(item => {
        item.onclick = () => {
            document.querySelectorAll('.sidebar-menu li').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            const tab = item.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(`tab-${tab}`).style.display = 'block';
            if (tab === 'orders') loadOrders();
            if (tab === 'products') renderProductsList();
        };
    });

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // Автопроверка каждую минуту
    setInterval(() => {
        if (!checkAuth() && document.getElementById('adminSection').style.display === 'grid') {
            checkAuthUI();
            showToast("⏰ Сессия истекла", "#F87171");
        }
    }, 60000);

    checkAuthUI();
</script>
</body>
</html>
