        renderCartModal();
        showToast("✓ Добавлено в корзину", "#4ADE80");
    };

    window.removeFromCart = function(id) {
        cart = cart.filter(item => item.id !== id);
        updateCartCount();
        renderCartModal();
        renderCatalog();
        showToast("✗ Удалено из корзины", "#F87171");
    };

    window.changeQuantity = function(id, delta) {
        const item = cart.find(i => i.id === id);
        if(item) {
            item.quantity += delta;
            if(item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartCount();
            renderCartModal();
            renderCatalog();
        }
    };

    // ========== КУРС ВАЛЮТ ==========
    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderCatalog();
    }

    function getPrice(product) {
        const basePrice = product.salePrice ? product.salePrice : product.price_usd;
        if(currentCurrency === 'USD') return { val: basePrice, sym: '$', oldVal: product.salePrice ? product.price_usd : null };
        return { val: Math.round(basePrice * rubRate), sym: '₽', oldVal: product.salePrice ? Math.round(product.price_usd * rubRate) : null };
    }

    function getTotalUSD() {
        return cart.reduce((sum, item) => {
            const product = products.find(p => p.id === item.id);
            const price = product ? (product.salePrice || product.price_usd) : 0;
            return sum + (price * item.quantity);
        }, 0);
    }

    // ========== ФИЛЬТРАЦИЯ ==========
    function getFilteredProducts() {
        let filtered = products;
        if(currentCategory !== 'all') {
            filtered = filtered.filter(p => p.category === currentCategory);
        }
        if(searchQuery) {
            filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.desc.toLowerCase().includes(searchQuery.toLowerCase()));
        }
        if(sortType === 'price_asc') filtered.sort((a,b) => (a.salePrice || a.price_usd) - (b.salePrice || b.price_usd));
        if(sortType === 'price_desc') filtered.sort((a,b) => (b.salePrice || b.price_usd) - (a.salePrice || a.price_usd));
        return filtered;
    }

    function renderCatalog() {
        if(!products || products.length === 0) {
            catalogDiv.innerHTML = '<div style="text-align:center; padding:60px;">🔄 Загрузка товаров...</div>';
            return;
        }
        
        const filtered = getFilteredProducts();
        if(filtered.length === 0) {
            catalogDiv.innerHTML = '<div style="text-align:center; padding:60px;">🔍 Ничего не найдено</div>';
            return;
        }
        
        catalogDiv.innerHTML = filtered.map(p => {
            const price = getPrice(p);
            const inCart = cart.find(i => i.id === p.id);
            const hasSale = p.salePrice && p.salePrice < p.price_usd;
            
            // Обработка фото
            let imgHtml;
            if (p.img && (p.img.startsWith('images/') || p.img.startsWith('http'))) {
                imgHtml = `<img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback\\'>📦</span>';">`;
            } else {
                imgHtml = `<span class="fallback">📦</span>`;
            }
            
            return `
                <div class="product-card" onclick="goToProduct(${p.id})">
                    <div class="product-img">${imgHtml}</div>
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-desc">${escapeHtml(p.desc ? p.desc.substring(0, 80) : '')}...</div>
                    <div class="product-price">
                        ${price.val} ${price.sym}
                        ${price.oldVal ? `<span class="old-price">${price.oldVal} ${price.sym}</span>` : ''}
                        ${hasSale ? `<span class="sale-badge">🔥 Скидка</span>` : ''}
                    </div>
                    <button class="btn-cart" onclick="event.stopPropagation(); addToCart(${p.id})">${inCart ? '✓ В корзине' : '+ В корзину'}</button>
                </div>
            `;
        }).join('');
    }

    function goToProduct(id) {
        const product = products.find(p => p.id === id);
        if(product) {
            localStorage.setItem('currentProduct', JSON.stringify(product));
            window.location.href = 'product.html';
        }
    }

    function escapeHtml(text) {
        if(!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== ОТРИСОВКА КОРЗИНЫ ==========
    function renderCartModal() {
        const container = document.getElementById('cartItemsList');
        const footer = document.getElementById('cartFooter');
        
        if(cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">🛒 Корзина пуста</div>';
            footer.style.display = 'none';
            return;
        }
        
        footer.style.display = 'block';
        let totalUSD = 0;
        
        container.innerHTML = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            if(!product) return '';
            const price = getPrice(product);
            const itemTotalUSD = (product.salePrice || product.price_usd) * item.quantity;
            totalUSD += itemTotalUSD;
            const itemTotal = getPrice({ price_usd: (product.salePrice || product.price_usd) });
            return `
                <div class="cart-item">
                    <div class="cart-item-img">📦</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${escapeHtml(product.name)}</div>
                        <div class="cart-item-price">${price.val} ${price.sym}</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="cart-qty-btn" onclick="changeQuantity(${item.id}, -1)">−</button>
                        <span style="min-width:30px;text-align:center;">${item.quantity}</span>
                        <button class="cart-qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        <button class="cart-qty-btn" onclick="removeFromCart(${item.id})" style="background:#FF4D4D20;">✕</button>
                    </div>
                    <div style="min-width:60px;text-align:right;color:#6C63FF;">${itemTotal.val * item.quantity} ${itemTotal.sym}</div>
                </div>
            `;
        }).join('');
        
        const total = getPrice({ price_usd: totalUSD });
        document.getElementById('cartTotal').innerHTML = `${total.val} ${total.sym}`;
    }

    // ========== МОДАЛКИ ==========
    function openCartModal() {
        renderCartModal();
        cartModal.classList.add('show');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeCartModal() {
        cartModal.classList.remove('show');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    function openContactModal() {
        contactModal.classList.add('show');
        overlay.classList.add('show');
    }

    function closeContactModal() {
        contactModal.classList.remove('show');
        overlay.classList.remove('show');
    }

    cartIcon.onclick = () => openCartModal();
    closeCartBtn.onclick = () => closeCartModal();
    overlay.onclick = () => {
        closeCartModal();
        closeContactModal();
    };
    contactBtn.onclick = () => openContactModal();
    window.closeContactModal = closeContactModal;

    // ========== ОФОРМЛЕНИЕ ЗАКАЗА (ИСПРАВЛЕНО) ==========
    document.getElementById('checkoutBtn').onclick = function() {
        // Проверяем, есть ли товары в корзине
        if (cart.length === 0) {
            showToast("Корзина пуста", "#F87171");
            return;
        }
        
        try {
            // Сохраняем данные корзины в localStorage
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            localStorage.setItem('checkoutCurrency', currentCurrency);
            localStorage.setItem('checkoutTotal', JSON.stringify(getTotalUSD()));
            
            console.log('✅ Данные сохранены:', {
                cart: cart,
                currency: currentCurrency,
                total: getTotalUSD()
            });
            
            // Переходим на страницу оформления
            window.location.href = 'checkout.html';
        } catch (error) {
            console.error('Ошибка при оформлении заказа:', error);
            showToast("Ошибка при оформлении заказа", "#F87171");
        }
    };

    // ========== КАТЕГОРИИ ==========
    function renderCategories() {
        categoriesDiv.innerHTML = categories.map(cat => `
            <button class="category-btn ${currentCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">
                ${cat.name}
            </button>
        `).join('');
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.onclick = () => {
                currentCategory = btn.dataset.cat;
                renderCategories();
                renderCatalog();
            };
        });
    }

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ========== СОБЫТИЯ ==========
    searchInput.oninput = () => {
        searchQuery = searchInput.value;
        renderCatalog();
    };
    
    document.getElementById('sortSelect').onchange = (e) => {
        sortType = e.target.value;
        renderCatalog();
    };
    
    document.getElementById('usdBtn').onclick = () => {
        currentCurrency = 'USD';
        renderCatalog();
        renderCartModal();
    };
    
    document.getElementById('rubBtn').onclick = () => {
        currentCurrency = 'RUB';
        renderCatalog();
        renderCartModal();
    };

    // ========== ЗАПУСК ==========
    loadProducts();
    fetchRubRate();
    updateCartCount();
</script>
</body>
</html>
