<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Магазин устройств безопасности</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #FFFFFF, #6C63FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .logo p {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 40px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            border-color: #6C63FF;
            color: #6C63FF;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 40px;
            color: white;
            margin: 30px 0 20px;
        }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .category-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 40px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: #6C63FF;
            border-color: #6C63FF;
            color: white;
        }

        .sort-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin: 30px 0 60px;
        }

        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #6C63FF;
        }

        .product-img {
            font-size: 64px;
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin: 8px 0;
            line-height: 1.4;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #6C63FF;
            margin: 12px 0;
        }

        .old-price {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            text-decoration: line-through;
            margin-left: 8px;
        }

        .sale-badge {
            background: #FF4D4D;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 11px;
            margin-left: 8px;
        }

        .btn-cart {
            width: 100%;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cart:hover {
            transform: scale(1.02);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(108, 99, 255, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
        }

        .cart-count {
            background: #FF4D4D;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 12px;
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            max-width: 90vw;
            max-height: 80vh;
            background: #111118;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            z-index: 1001;
            overflow: hidden;
        }

        .cart-modal.show {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item-img {
            font-size: 32px;
            width: 50px;
            text-align: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 14px;
        }

        .cart-item-price {
            font-size: 12px;
            color: #6C63FF;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-qty-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-size: 16px;
        }

        .cart-qty-btn:hover {
            background: #6C63FF;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .close-cart {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .overlay.show {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111118;
            border-left: 4px solid #6C63FF;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        .contact-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            background: #111118;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 32px;
            z-index: 2000;
            text-align: center;
        }

        .contact-modal.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .contact-link {
            display: inline-block;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            margin: 8px 0;
        }

        .close-contact {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.reload()">
            <h1>CuberPulse</h1>
            <p>professional hardware · security research</p>
        </div>
        <div class="nav-buttons">
            <button class="btn-outline" id="usdBtn">USD $</button>
            <button class="btn-outline" id="rubBtn">RUB ₽</button>
            <button class="btn-outline" id="contactBtn">📞 Контакт</button>
            <div class="cart-icon" id="cartIcon">
                🛒 <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск устройств, модулей...">

    <div class="categories" id="categories"></div>
    
    <select id="sortSelect" class="sort-select">
        <option value="default">По умолчанию</option>
        <option value="price_asc">Цена: по возрастанию</option>
        <option value="price_desc">Цена: по убыванию</option>
    </select>

    <div id="catalog" class="catalog"></div>
</div>

<div class="cart-modal" id="cartModal">
    <div class="cart-header">
        <span style="font-weight:600;">🛒 Корзина</span>
        <button class="close-cart" id="closeCartBtn">✕</button>
    </div>
    <div id="cartItemsList" class="cart-items">
        <div style="text-align:center; padding:40px;">Корзина пуста</div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none;">
        <div class="cart-total">
            <span>Итого:</span>
            <span id="cartTotal">0 $</span>
        </div>
        <button class="btn-checkout" id="checkoutBtn">Оформить заказ</button>
    </div>
</div>

<div class="contact-modal" id="contactModal">
    <h3>📞 Свяжитесь с нами</h3>
    <p>По всем вопросам обращайтесь к нашему менеджеру:</p>
    <a href="https://t.me/cuberpulse" target="_blank" class="contact-link">@cuberpulse</a>
    <button class="close-contact" onclick="closeContactModal()">Закрыть</button>
</div>

<script>
    // ========== ТОВАРЫ (ЗАГРУЗКА ИЗ АДМИНКИ) ==========
    let products = [];
    let currentCategory = "all";
    let searchQuery = "";
    let currentCurrency = 'USD';
    let rubRate = 92;
    let sortType = "default";
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Категории
    const categories = [
        { id: "all", name: "🏠 Все товары" },
        { id: "devices", name: "📟 Устройства" },
        { id: "modules", name: "🔌 Модули" },
        { id: "firmware", name: "⚙️ Прошивки" },
        { id: "antennas", name: "📡 Антенны" },
        { id: "accessories", name: "🔧 Аксессуары" },
        { id: "sdr", name: "📻 SDR" },
        { id: "guides", name: "📚 Обучение" }
    ];

    // Загрузка товаров из админ-панели
    function loadProductsFromAdmin() {
        const saved = localStorage.getItem('admin_products');
        if(saved && saved !== 'undefined' && saved !== 'null') {
            try {
                const parsed = JSON.parse(saved);
                if(parsed && parsed.length > 0) {
                    products = parsed;
                    renderCategories();
                    renderCatalog();
                    return;
                }
            } catch(e) {
                console.log('Ошибка парсинга товаров:', e);
            }
        }
        
        // Если товаров нет - создаём дефолтные
        setDefaultProducts();
    }

    // Дефолтные товары (если в админке пусто)
    function setDefaultProducts() {
        products = [
            { id: 1, name: "Flipper Zero", price_usd: 169, salePrice: null, category: "devices", img: "🐬", desc: "Мультитул для пентеста: RFID, IR, GPIO, iButton, Sub-GHz.", specs: ["OLED дисплей", "Аккумулятор 2000mAh"] },
            { id: 2, name: "HackRF One", price_usd: 299, salePrice: null, category: "devices", img: "📡", desc: "SDR-трансивер 1 МГц – 6 ГГц, полоса 20 МГц.", specs: ["1MHz-6GHz", "20MHz полоса"] },
            { id: 3, name: "NRF24L01+ модуль", price_usd: 12, salePrice: null, category: "modules", img: "📻", desc: "2.4GHz беспроводной модуль для Flipper Zero.", specs: ["2.4GHz", "Дальность до 100м"] },
            { id: 4, name: "CC1101 модуль", price_usd: 15, salePrice: null, category: "modules", img: "🔘", desc: "Суб-ГГц трансивер для Flipper Zero.", specs: ["315/433/868/915MHz"] },
            { id: 5, name: "ESP8266 WiFi модуль", price_usd: 8, salePrice: null, category: "modules", img: "🔵", desc: "WiFi модуль для Flipper Zero.", specs: ["WiFi", "Arduino"] },
            { id: 6, name: "Кастомная прошивка Flipper", price_usd: 29, salePrice: null, category: "firmware", img: "⚙️", desc: "Расширенный функционал: новые протоколы, бэкапы.", specs: ["Новые протоколы", "BadUSB"] },
            { id: 7, name: "RTLSDR v3", price_usd: 35, salePrice: null, category: "sdr", img: "📻", desc: "Бюджетный SDR приёмник 100kHz – 1.7GHz.", specs: ["100kHz-1.7GHz"] },
            { id: 8, name: "Видеокурс по SDR", price_usd: 89, salePrice: 69, category: "guides", img: "📚", desc: "Полное руководство по SDR и HackRF.", specs: ["15 часов видео"] }
        ];
        localStorage.setItem('admin_products', JSON.stringify(products));
        renderCategories();
        renderCatalog();
    }

    // DOM элементы
    const catalogDiv = document.getElementById('catalog');
    const categoriesDiv = document.getElementById('categories');
    const searchInput = document.getElementById('searchInput');
    const cartCountSpan = document.getElementById('cartCount');
    const cartIcon = document.getElementById('cartIcon');
    const cartModal = document.getElementById('cartModal');
    const overlay = document.getElementById('overlay');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const contactBtn = document.getElementById('contactBtn');
    const contactModal = document.getElementById('contactModal');

    // ========== ФУНКЦИИ КОРЗИНЫ ==========
    function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartCountSpan.innerText = count;
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function addToCart(id) {
        const existing = cart.find(item => item.id === id);
        if(existing) {
            existing.quantity++;
        } else {
            cart.push({ id: id, quantity: 1 });
        }
        updateCartCount();
        renderCatalog();
        renderCartModal();
        showToast("✓ Добавлено в корзину", "#4ADE80");
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        updateCartCount();
        renderCartModal();
        renderCatalog();
        showToast("✗ Удалено из корзины", "#F87171");
    }

    function changeQuantity(id, delta) {
        const item = cart.find(i => i.id === id);
        if(item) {
            item.quantity += delta;
            if(item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartCount();
            renderCartModal();
            renderCatalog();
        }
    }

    // ========== КУРС ВАЛЮТ ==========
    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderCatalog();
    }

    function getPrice(product) {
        const basePrice = product.salePrice ? product.salePrice : product.price_usd;
        if(currentCurrency === 'USD') return { val: basePrice, sym: '$', oldVal: product.salePrice ? product.price_usd : null };
        return { val: Math.round(basePrice * rubRate), sym: '₽', oldVal: product.salePrice ? Math.round(product.price_usd * rubRate) : null };
    }

    function getTotalUSD() {
        return cart.reduce((sum, item) => {
            const product = products.find(p => p.id === item.id);
            const price = product ? (product.salePrice || product.price_usd) : 0;
            return sum + (price * item.quantity);
        }, 0);
    }

    // ========== ФИЛЬТРАЦИЯ ==========
    function getFilteredProducts() {
        let filtered = products;
        if(currentCategory !== 'all') {
            filtered = filtered.filter(p => p.category === currentCategory);
        }
        if(searchQuery) {
            filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.desc.toLowerCase().includes(searchQuery.toLowerCase()));
        }
        if(sortType === 'price_asc') filtered.sort((a,b) => (a.salePrice || a.price_usd) - (b.salePrice || b.price_usd));
        if(sortType === 'price_desc') filtered.sort((a,b) => (b.salePrice || b.price_usd) - (a.salePrice || a.price_usd));
        return filtered;
    }

    function renderCatalog() {
        const filtered = getFilteredProducts();
        if(filtered.length === 0) {
            catalogDiv.innerHTML = '<div style="text-align:center; padding:60px;">🔍 Ничего не найдено</div>';
            return;
        }
        catalogDiv.innerHTML = filtered.map(p => {
            const price = getPrice(p);
            const inCart = cart.find(i => i.id === p.id);
            const hasSale = p.salePrice && p.salePrice < p.price_usd;
            return `
                <div class="product-card" onclick="goToProduct(${p.id})">
                    <div class="product-img">${p.img || '📦'}</div>
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-desc">${escapeHtml(p.desc.substring(0, 80))}...</div>
                    <div class="product-price">
                        ${price.val} ${price.sym}
                        ${price.oldVal ? `<span class="old-price">${price.oldVal} ${price.sym}</span>` : ''}
                        ${hasSale ? `<span class="sale-badge">🔥 Скидка</span>` : ''}
                    </div>
                    <button class="btn-cart" onclick="event.stopPropagation(); addToCart(${p.id})">${inCart ? '✓ В корзине' : '+ В корзину'}</button>
                </div>
            `;
        }).join('');
    }

    function goToProduct(id) {
        const product = products.find(p => p.id === id);
        if(product) {
            localStorage.setItem('currentProduct', JSON.stringify(product));
            window.location.href = 'product.html';
        }
    }

    function escapeHtml(text) {
        if(!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== ОТРИСОВКА КОРЗИНЫ ==========
    function renderCartModal() {
        const container = document.getElementById('cartItemsList');
        const footer = document.getElementById('cartFooter');
        
        if(cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">🛒 Корзина пуста</div>';
            footer.style.display = 'none';
            return;
        }
        
        footer.style.display = 'block';
        let totalUSD = 0;
        
        container.innerHTML = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            if(!product) return '';
            const price = getPrice(product);
            const itemTotalUSD = (product.salePrice || product.price_usd) * item.quantity;
            totalUSD += itemTotalUSD;
            const itemTotal = getPrice({ price_usd: (product.salePrice || product.price_usd) });
            return `
                <div class="cart-item">
                    <div class="cart-item-img">${product.img || '📦'}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${escapeHtml(product.name)}</div>
                        <div class="cart-item-price">${price.val} ${price.sym}</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="cart-qty-btn" onclick="changeQuantity(${item.id}, -1)">−</button>
                        <span style="min-width:30px;text-align:center;">${item.quantity}</span>
                        <button class="cart-qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        <button class="cart-qty-btn" onclick="removeFromCart(${item.id})" style="background:#FF4D4D20;">✕</button>
                    </div>
                    <div style="min-width:60px;text-align:right;color:#6C63FF;">${itemTotal.val * item.quantity} ${itemTotal.sym}</div>
                </div>
            `;
        }).join('');
        
        const total = getPrice({ price_usd: totalUSD });
        document.getElementById('cartTotal').innerHTML = `${total.val} ${total.sym}`;
    }

    // ========== МОДАЛКИ ==========
    function openCartModal() {
        renderCartModal();
        cartModal.classList.add('show');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeCartModal() {
        cartModal.classList.remove('show');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    function openContactModal() {
        contactModal.classList.add('show');
        overlay.classList.add('show');
    }

    function closeContactModal() {
        contactModal.classList.remove('show');
        overlay.classList.remove('show');
    }

    cartIcon.onclick = () => openCartModal();
    closeCartBtn.onclick = () => closeCartModal();
    overlay.onclick = () => {
        closeCartModal();
        closeContactModal();
    };
    contactBtn.onclick = () => openContactModal();
    window.closeContactModal = closeContactModal;

    // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
    document.getElementById('checkoutBtn').onclick = () => {
        if(cart.length === 0) {
            showToast("Корзина пуста", "#F87171");
            return;
        }
        localStorage.setItem('checkoutCart', JSON.stringify(cart));
        localStorage.setItem('checkoutCurrency', currentCurrency);
        localStorage.setItem('checkoutTotal', getTotalUSD());
        window.location.href = 'checkout.html';
    };

    // ========== КАТЕГОРИИ ==========
    function renderCategories() {
        categoriesDiv.innerHTML = categories.map(cat => `
            <button class="category-btn ${currentCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">
                ${cat.name}
            </button>
        `).join('');
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.onclick = () => {
                currentCategory = btn.dataset.cat;
                renderCategories();
                renderCatalog();
            };
        });
    }

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // ========== СОБЫТИЯ ==========
    searchInput.oninput = () => {
        searchQuery = searchInput.value;
        renderCatalog();
    };
    
    document.getElementById('sortSelect').onchange = (e) => {
        sortType = e.target.value;
        renderCatalog();
    };
    
    document.getElementById('usdBtn').onclick = () => {
        currentCurrency = 'USD';
        renderCatalog();
        renderCartModal();
    };
    
    document.getElementById('rubBtn').onclick = () => {
        currentCurrency = 'RUB';
        renderCatalog();
        renderCartModal();
    };

    // ========== ЗАПУСК ==========
    loadProductsFromAdmin();
    fetchRubRate();
    updateCartCount();
</script>
</body>
</html>
