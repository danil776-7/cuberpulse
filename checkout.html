<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuberPulse | Оформление заказа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #FFFFFF, #6C63FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .back-link {
            color: #6C63FF;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            margin: 40px 0 60px;
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
        }

        .form-section h2 {
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6C63FF;
        }

        .order-summary {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .order-summary h3 {
            margin-bottom: 20px;
        }

        .order-items {
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .order-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-item-img {
            font-size: 32px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            font-size: 20px;
            font-weight: 700;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 16px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            border: none;
            padding: 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .payment-options {
            background: rgba(108, 99, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
        }

        .payment-options label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin: 8px 0;
        }

        .error-message {
            color: #F87171;
            font-size: 12px;
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111118;
            border-left: 4px solid #6C63FF;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .contact-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-width: 90vw;
            background: #111118;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 32px;
            z-index: 2000;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .contact-modal.show {
            display: block;
        }

        .contact-modal h3 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .contact-modal p {
            margin: 16px 0;
            color: rgba(255,255,255,0.7);
        }

        .contact-link {
            display: inline-block;
            background: linear-gradient(135deg, #6C63FF, #4A42D0);
            padding: 14px 28px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .contact-link:hover {
            transform: scale(1.05);
        }

        .close-contact {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }

        .overlay-contact {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1999;
        }

        .overlay-contact.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .success-icon {
            font-size: 50px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="overlay-contact" id="overlayContact"></div>
<div class="contact-modal" id="contactModal">
    <div class="success-icon">✅</div>
    <h3>Заказ оформлен!</h3>
    <p>Ваш заказ №<span id="orderNumber"></span> принят.</p>
    <p>Для подтверждения и оплаты свяжитесь с менеджером:</p>
    <a href="https://t.me/ваш_username" target="_blank" class="contact-link">📱 Написать в Telegram</a>
    <p style="font-size: 12px;">Или напишите нам: @ваш_username</p>
    <button class="close-contact" onclick="closeContactModal()">Закрыть</button>
</div>

<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'">
            <h1>CuberPulse</h1>
        </div>
    </div>

    <a href="index.html" class="back-link">← Вернуться в каталог</a>

    <div class="checkout-container">
        <div class="form-section">
            <h2>📋 Данные для доставки</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>ФИО *</label>
                    <input type="text" id="fullName" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="phone" required placeholder="+7 999 123-45-67" maxlength="18">
                    <div class="error-message" id="phoneError"></div>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Способ доставки *</label>
                    <select id="delivery" required>
                        <option value="">Выберите способ доставки</option>
                        <option value="cdek">📦 CDEK (500 ₽)</option>
                        <option value="dhl">✈️ DHL Express (1500 ₽)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Адрес доставки *</label>
                    <textarea id="address" rows="3" placeholder="Город, улица, дом, квартира, почтовый индекс"></textarea>
                </div>
                <div class="form-group">
                    <label>Город *</label>
                    <input type="text" id="city" required placeholder="Москва, Санкт-Петербург и т.д.">
                </div>
                <div class="form-group">
                    <label>Индекс *</label>
                    <input type="text" id="zip" required placeholder="123456" maxlength="6">
                </div>
                <div class="form-group">
                    <label>Комментарий к заказу</label>
                    <textarea id="comment" rows="2" placeholder="Дополнительная информация"></textarea>
                </div>
                
                <div class="payment-options">
                    <p style="margin-bottom: 12px;">💳 Способы оплаты:</p>
                    <label>
                        <input type="radio" name="payment" value="card" checked> Оплата картой онлайн
                    </label>
                    <label>
                        <input type="radio" name="payment" value="crypto"> Криптовалюта (USDT)
                    </label>
                </div>

                <button type="submit" class="btn-submit">✅ Оформить заказ</button>
            </form>
        </div>

        <div class="order-summary">
            <h3>🛒 Ваш заказ</h3>
            <div id="orderItems" class="order-items"></div>
            <div class="total-row">
                <span>Сумма:</span>
                <span id="subtotal" style="color:#6C63FF;">0 $</span>
            </div>
            <div class="total-row" style="border-top:none; padding-top:0;">
                <span>Доставка:</span>
                <span id="deliveryCost">0 $</span>
            </div>
            <div class="total-row">
                <span>Итого к оплате:</span>
                <span id="orderTotal" style="color:#6C63FF; font-size:24px;">0 $</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== ТОВАРЫ ==========
    const products = [
        { id: 1, name: "Flipper Zero", price_usd: 169, img: "🐬" },
        { id: 2, name: "NRF24L01+ модуль", price_usd: 12, img: "📻" },
        { id: 3, name: "NRF24L01+ PA+LNA", price_usd: 19, img: "📡" },
        { id: 4, name: "CC1101 модуль", price_usd: 15, img: "🔘" },
        { id: 5, name: "ESP8266 NodeMCU", price_usd: 8, img: "🔵" },
        { id: 6, name: "ESP32-C3 модуль", price_usd: 12, img: "🔵" },
        { id: 7, name: "Кастомная прошивка Flipper", price_usd: 29, img: "⚙️" },
        { id: 8, name: "Marauder для Flipper", price_usd: 24, img: "⚙️" },
        { id: 9, name: "RTLSDR v3", price_usd: 35, img: "📻" },
        { id: 10, name: "Видеокурс по SDR", price_usd: 89, img: "📚" }
    ];

    let cart = JSON.parse(localStorage.getItem('checkoutCart')) || [];
    let currency = localStorage.getItem('checkoutCurrency') || 'USD';
    let totalUSD = parseFloat(localStorage.getItem('checkoutTotal')) || 0;
    let rubRate = 92;

    let deliveryCostUSD = 0;
    const deliveryPrices = { cdek: 5, dhl: 15 };
    const deliveryNames = { cdek: "📦 CDEK", dhl: "✈️ DHL Express" };

    // Валидация телефона
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', (e) => {
        let raw = e.target.value.replace(/\D/g, '');
        if(raw.length > 11) raw = raw.slice(0, 11);
        if(raw.startsWith('8')) raw = '7' + raw.slice(1);
        
        let formatted = '';
        if(raw.length > 0) {
            formatted = '+7';
            if(raw.length > 1) formatted += ' ' + raw.slice(1, 4);
            if(raw.length > 4) formatted += ' ' + raw.slice(4, 7);
            if(raw.length > 7) formatted += '-' + raw.slice(7, 9);
            if(raw.length > 9) formatted += '-' + raw.slice(9, 11);
        }
        e.target.value = formatted;
        
        const errorDiv = document.getElementById('phoneError');
        if(raw.length === 11 && raw.startsWith('7')) errorDiv.textContent = '';
        else if(raw.length === 10) errorDiv.textContent = '';
        else if(raw.length > 0) errorDiv.textContent = 'Введите корректный номер (11 цифр)';
        else errorDiv.textContent = '';
    });

    async function fetchRubRate() {
        try {
            const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await res.json();
            rubRate = data.rates.RUB;
        } catch(e) { rubRate = 92; }
        renderOrderSummary();
    }

    function getPrice(priceUSD) {
        if(currency === 'USD') return { val: priceUSD, sym: '$' };
        return { val: Math.round(priceUSD * rubRate), sym: '₽' };
    }

    function renderOrderSummary() {
        const container = document.getElementById('orderItems');
        if(cart.length === 0) {
            window.location.href = 'index.html';
            return;
        }

        container.innerHTML = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            if(!product) return '';
            const price = getPrice(product.price_usd);
            const total = getPrice(product.price_usd * item.quantity);
            return `
                <div class="order-item">
                    <div class="order-item-info">
                        <span class="order-item-img">${product.img}</span>
                        <div>
                            <div style="font-weight:500;">${product.name}</div>
                            <div style="font-size:12px;">${price.val} ${price.sym} × ${item.quantity}</div>
                        </div>
                    </div>
                    <div style="color:#6C63FF;">${total.val} ${total.sym}</div>
                </div>
            `;
        }).join('');

        const subtotal = getPrice(totalUSD);
        const deliveryTotal = getPrice(deliveryCostUSD);
        const grandTotal = getPrice(totalUSD + deliveryCostUSD);
        
        document.getElementById('subtotal').innerHTML = `${subtotal.val} ${subtotal.sym}`;
        document.getElementById('deliveryCost').innerHTML = deliveryCostUSD === 0 ? 'Бесплатно' : `${deliveryTotal.val} ${deliveryTotal.sym}`;
        document.getElementById('orderTotal').innerHTML = `${grandTotal.val} ${grandTotal.sym}`;
    }

    document.getElementById('delivery').onchange = (e) => {
        deliveryCostUSD = deliveryPrices[e.target.value] || 0;
        renderOrderSummary();
    };

    // ========== ОТПРАВКА В TELEGRAM через прокси ==========
    // Используем сервис api.telegram.org (он работает с GitHub Pages)
    const BOT_TOKEN = "8958424168:AAHZ2f5oGU81VuTXwJCuEdta7ntFvAOuAfc";
    const CHAT_ID = "-1003951304278";

    async function sendOrderToTelegram(orderData) {
        const message = `🛒 НОВЫЙ ЗАКАЗ 🛒
━━━━━━━━━━━━━━━━━━━

👤 КЛИЕНТ:
ФИО: ${orderData.fullName}
Телефон: ${orderData.phone}
Email: ${orderData.email}

📍 ДОСТАВКА:
Способ: ${orderData.delivery}
Город: ${orderData.city}
Адрес: ${orderData.address}
Индекс: ${orderData.zip}

📦 ТОВАРЫ:
${orderData.items}

💰 ОПЛАТА:
Способ: ${orderData.payment}
Сумма: ${orderData.total}

💬 КОММЕНТАРИЙ:
${orderData.comment || "Нет"}

⏰ Время: ${new Date().toLocaleString()}`;

        // Используем encodeURIComponent для правильной отправки
        const encodedMessage = encodeURIComponent(message);
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodedMessage}&parse_mode=HTML`;
        
        try {
            console.log('Отправка запроса в Telegram...');
            const response = await fetch(url, {
                method: 'GET',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const result = await response.json();
            console.log('Ответ Telegram:', result);
            
            if(result.ok) {
                return true;
            } else {
                console.error('Ошибка Telegram:', result.description);
                return false;
            }
        } catch(e) {
            console.error('Ошибка отправки:', e);
            return false;
        }
    }

    function saveOrderLocally(orderData) {
        const orders = JSON.parse(localStorage.getItem('saved_orders') || '[]');
        orders.push({
            ...orderData,
            savedAt: new Date().toISOString()
        });
        localStorage.setItem('saved_orders', JSON.stringify(orders));
        console.log('Заказ сохранён локально');
    }

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = color;
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function openContactModal(orderId) {
        document.getElementById('orderNumber').innerText = orderId;
        document.getElementById('overlayContact').classList.add('show');
        document.getElementById('contactModal').classList.add('show');
    }

    function closeContactModal() {
        document.getElementById('overlayContact').classList.remove('show');
        document.getElementById('contactModal').classList.remove('show');
        window.location.href = 'index.html';
    }

    window.closeContactModal = closeContactModal;
    document.getElementById('overlayContact').onclick = closeContactModal;

    // Обработка формы
    document.getElementById('checkoutForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const delivery = document.getElementById('delivery').value;
        const address = document.getElementById('address').value.trim();
        const city = document.getElementById('city').value.trim();
        const zip = document.getElementById('zip').value.trim();
        const comment = document.getElementById('comment').value.trim();
        const payment = document.querySelector('input[name="payment"]:checked').value;
        
        if(!fullName) { showToast("Введите ФИО", "#F87171"); return; }
        
        const phoneDigits = phone.replace(/\D/g, '');
        if(phoneDigits.length !== 11 || !phoneDigits.startsWith('7')) {
            showToast("Введите корректный номер телефона", "#F87171");
            return;
        }
        
        if(!email || !email.includes('@')) { showToast("Введите корректный Email", "#F87171"); return; }
        if(!delivery) { showToast("Выберите способ доставки", "#F87171"); return; }
        if(!city) { showToast("Введите город доставки", "#F87171"); return; }
        if(!address) { showToast("Введите адрес доставки", "#F87171"); return; }
        if(!zip || zip.length < 5) { showToast("Введите почтовый индекс", "#F87171"); return; }
        
        const itemsList = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            const price = getPrice(product.price_usd);
            return `• ${product.name} × ${item.quantity} = ${price.val * item.quantity} ${price.sym}`;
        }).join('\n');
        
        const paymentNames = { card: "💳 Оплата картой онлайн", crypto: "🪙 Криптовалюта (USDT)" };
        const grandTotal = getPrice(totalUSD + deliveryCostUSD);
        
        const orderId = Math.floor(Math.random() * 1000000);
        
        const orderData = {
            fullName, phone, email,
            delivery: deliveryNames[delivery] || delivery,
            city, address, zip,
            items: itemsList,
            payment: paymentNames[payment],
            total: `${grandTotal.val} ${grandTotal.sym}`,
            comment
        };
        
        const btn = document.querySelector('.btn-submit');
        const originalText = btn.innerText;
        btn.innerText = "⏳ Отправка...";
        btn.disabled = true;
        
        // Пытаемся отправить в Telegram
        const sent = await sendOrderToTelegram(orderData);
        
        if(sent) {
            console.log('✅ Заказ отправлен в Telegram');
        } else {
            console.log('⚠️ Telegram не ответил, сохраняем локально');
            saveOrderLocally(orderData);
            showToast("Заказ сохранён локально", "#FBBF24");
        }
        
        // Очищаем корзину
        localStorage.removeItem('cart');
        localStorage.removeItem('checkoutCart');
        
        // Открываем модалку с контактом
        openContactModal(orderId);
        
        btn.innerText = originalText;
        btn.disabled = false;
    };
    
    fetchRubRate();
    
    if(cart.length === 0) {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
